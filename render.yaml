# Render Blueprint: one web service (API + console) and one Postgres database.
# Dashboard: New > Blueprint > pick this repo. Then fill in the secrets marked "sync: false".
services:
  - type: web
    name: paymaster
    runtime: docker
    plan: free            # free sleeps after 15 min idle (first load ~50 s). Use "starter" while judges are testing.
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paymaster-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: SIGNUP_ENABLED
        value: "true"     # judges create their own company, then press "Add demo data" on the Team page
      - key: ALLOW_DEMO_DATA
        value: "1"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ACCOUNT_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CONSOLE_URL
        sync: false       # https://<your-service>.onrender.com/console  (used for links inside alerts)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886

databases:
  - name: paymaster-db
    plan: free            # free databases expire after 30 days: fine for judging, not for real use
    databaseName: paymaster
    user: paymaster
