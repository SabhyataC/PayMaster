<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="layout.css">
    <title>PayMaster: Trust Graph</title>
    <style>
        :root {
            --bg: #f7f6f2;
            --card: #fff;
            --line: #e4e2da;
            --ink: #1d1d1b;
            --muted: #6b6a63;
            --ok: #0b6b4f;
            --ok-bg: #e6f3ee;
            --bad: #b3261e;
            --bad-bg: #fbe9e7;
            --wait: #6b6a63;
            --wait-bg: #eeede8;
            --fact: #1f4e8c;
            --fact-bg: #e8eff9;
            --ai: #7a4a00;
            --ai-bg: #fdf0d9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f2;
            color: #1c1b18;
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        main {
            max-width: 1500px;
            margin: 0;
            padding: 8px 28px;
            min-width: 0;
        }

        .content {
            min-width: 0;
        }

        header {
            /* background: #fff; */
            /* border-bottom: 1px solid var(--line); */
            padding: 6px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        header a {
            color: var(--ok);
            text-decoration: none;
            font-weight: 600;
        }

        header form {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        input {
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font: inherit;
            min-width: 0;
        }

        button {
            padding: 7px 12px;
            border: 1px solid var(--ok);
            background: var(--ok);
            color: #fff;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        .summary {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .summary h1 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        .summary .sub {
            color: var(--muted);
        }

        .verdict {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .verdict.complete {
            background: var(--ok-bg);
            color: var(--ok);
        }

        .verdict.incomplete {
            background: var(--wait-bg);
            color: var(--wait);
        }

        .verdict.broken {
            background: var(--bad-bg);
            color: var(--bad);
        }

        .legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 13px;
            color: var(--muted);
        }

        .chain {
            position: relative;
        }

        .node {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 0 12px;
            position: relative;
            padding-bottom: 14px;
        }

        .node:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 19px;
            top: 40px;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 20px;
            border: 2px solid;
            background: var(--card);
            z-index: 1;
        }

        .ok .dot {
            color: var(--ok);
            border-color: var(--ok);
            background: var(--ok-bg);
        }

        .problem .dot {
            color: var(--bad);
            border-color: var(--bad);
            background: var(--bad-bg);
        }

        .pending .dot {
            color: var(--wait);
            border-color: var(--line);
            background: var(--wait-bg);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 14px;
        }

        .problem .card {
            border-color: var(--bad);
        }

        .head {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .head h2 {
            font-size: 15px;
            margin: 0;
        }

        .state {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .03em;
        }

        .ok .state {
            color: var(--ok);
        }

        .problem .state {
            color: var(--bad);
        }

        .pending .state {
            color: var(--wait);
        }

        .tag {
            font-size: 12px;
            padding: 1px 8px;
            border-radius: 99px;
            margin-left: auto;
        }

        .tag.fact {
            background: var(--fact-bg);
            color: var(--fact);
        }

        .tag.ai {
            background: var(--ai-bg);
            color: var(--ai);
        }

        .summ {
            margin: 4px 0 0;
        }

        details {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        summary {
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            margin-top: 6px;
            width: 100%;
        }

        td {
            padding: 3px 8px 3px 0;
            vertical-align: top;
            border-top: 1px solid var(--line);
            word-break: break-word;
        }

        td:first-child {
            color: var(--muted);
            white-space: nowrap;
            width: 38%;
        }

        .rec {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .ai-box {
            margin-top: 6px;
            padding: 6px 10px;
            background: var(--ai-bg);
            color: var(--ai);
            border-radius: 6px;
            font-size: 13px;
        }

        ul.probs {
            margin: 6px 0 0 18px;
            padding: 0;
            color: var(--bad);
        }

        .err {
            color: var(--bad);
            padding: 16px 0;
        }

        /* ---- lifecycle timeline ---- */
        .life {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 12px 8px;
            margin-bottom: 14px;
        }

        .life h2 {
            font-size: 14px;
            margin: 0 0 12px 6px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
        }

        .lf {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .lf .st {
            position: relative;
            text-align: center;
            padding: 0 4px 8px;
        }

        .lf .st:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 15px;
            left: calc(50% + 17px);
            right: calc(-50% + 17px);
            height: 3px;
            background: var(--line);
        }

        .lf .st.done:not(:last-child)::after {
            background: var(--ok);
        }

        .lf .dt {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin: 0 auto 6px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 14px;
            border: 3px solid var(--line);
            background: #fff;
            color: var(--muted);
            position: relative;
            z-index: 1;
        }

        .lf .done .dt {
            border-color: var(--ok);
            background: var(--ok);
            color: #fff;
        }

        .lf .problem .dt {
            border-color: var(--bad);
            background: var(--bad);
            color: #fff;
        }

        .lf .skipped .dt {
            border-style: dashed;
        }

        .lf .nm {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.2;
        }

        .lf .tm {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .lf .dtl {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .lf .problem .nm {
            color: var(--bad);
        }

        @media (max-width: 760px) {
            .lf {
                grid-template-columns: 1fr;
            }

            .lf .st {
                text-align: left;
                display: grid;
                grid-template-columns: 40px 1fr;
                padding-bottom: 10px;
            }

            .lf .st:not(:last-child)::after {
                top: 34px;
                bottom: -4px;
                left: 15px;
                right: auto;
                width: 3px;
                height: auto;
            }

            .lf .dt {
                margin: 0;
            }
        }

        h2.sec {
            font-size: 16px;
            margin: 22px 0 8px;
        }

        .claim {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 4px solid var(--ok);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .claim.no {
            border-left-color: var(--bad);
        }

        .claim .top {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 12px;
        }

        .claim .verdict-w {
            font-weight: 700;
        }

        .claim.no .verdict-w {
            color: var(--bad);
        }

        .claim.yes .verdict-w {
            color: var(--ok);
        }

        .bt {
            padding: 1px 8px;
            border-radius: 99px;
            background: var(--wait-bg);
            color: var(--ink);
        }

        .bt.ai {
            background: var(--ai-bg);
            color: var(--ai);
        }

        .bt.human {
            background: var(--fact-bg);
            color: var(--fact);
        }

        .bt.gate {
            background: var(--bad-bg);
            color: var(--bad);
        }

        .claim p {
            margin: 4px 0;
        }

        .ids {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11px;
            color: var(--muted);
            word-break: break-all;
        }

        .step {
            border-left: 3px solid var(--line);
            padding: 2px 0 2px 10px;
            margin: 0 0 8px 6px;
        }

        .untrusted {
            font-style: italic;
        }

        .note {
            font-size: 12px;
            color: var(--muted);
        }

        /* ---- visual graph ---- */
        .stage {
            position: relative;
            background: #0e1726;
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 14px;
            overflow: hidden;
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, .07) 1px, transparent 0);
            background-size: 22px 22px;
        }

        .stage svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            margin: 4px 0 12px;
        }

        .ring {
            width: 64px;
            height: 64px;
            flex: none;
        }

        .meter {
            flex: 1;
            min-width: 200px;
        }

        .meter .bar {
            display: flex;
            height: 10px;
            border-radius: 99px;
            overflow: hidden;
            background: var(--wait-bg);
            margin: 6px 0;
        }

        .meter .bar i {
            display: block;
            height: 100%;
        }

        .meter .nums {
            font-size: 13px;
            color: var(--muted);
        }

        .gnode {
            cursor: pointer;
            outline: none;
        }

        .gnode .halo {
            opacity: 0;
            transition: opacity .2s;
        }

        .gnode:hover .halo,
        .gnode:focus .halo,
        .gnode.sel .halo {
            opacity: .55;
        }

        .gnode text.t {
            fill: #e6edf7;
            font: 600 13px system-ui, sans-serif;
            text-anchor: middle;
        }

        .gnode text.s {
            font: 700 10px system-ui, sans-serif;
            text-anchor: middle;
            letter-spacing: .06em;
        }

        .gnode text.i {
            font-size: 26px;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .gnode .ico {
            fill: none;
            stroke: #e6edf7;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .gnode.pending .ico {
            opacity: .45;
        }

        .gnode.ok .core {
            fill: #12362c;
            stroke: #34d399;
        }

        .gnode.ok text.s {
            fill: #34d399;
        }

        .gnode.problem .core {
            fill: #3b1518;
            stroke: #f87171;
        }

        .gnode.problem text.s {
            fill: #f87171;
        }

        .gnode.pending .core {
            fill: #172033;
            stroke: #475569;
            stroke-dasharray: 5 5;
        }

        .gnode.pending text.s {
            fill: #64748b;
        }

        .gnode.pending text.i {
            opacity: .45;
        }

        .gnode .core {
            stroke-width: 3;
        }

        .gnode.ok .halo {
            fill: #34d399;
        }

        .gnode.problem .halo {
            fill: #f87171;
        }

        .gnode.pending .halo {
            fill: #64748b;
        }

        .gnode.problem .pulse {
            fill: none;
            stroke: #f87171;
            stroke-width: 2;
            transform-box: fill-box;
            transform-origin: center;
            animation: pulse 1.6s ease-out infinite;
        }

        .gnode .sel-ring {
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-dasharray: 3 5;
            opacity: 0;
        }

        .gnode.sel .sel-ring {
            opacity: .9;
        }

        .aibadge rect {
            fill: #f59e0b;
        }

        .aibadge text {
            fill: #1c1100;
            font: 800 10px system-ui, sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .edge {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .edge.ok {
            stroke: #34d399;
            stroke-dasharray: 8 10;
            animation: flow 1.1s linear infinite;
        }

        .edge.bad {
            stroke: #f87171;
            stroke-dasharray: 3 9;
        }

        .edge.wait {
            stroke: #334155;
            stroke-dasharray: 2 9;
        }

        .cross {
            stroke: #f87171;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .crossbg {
            fill: #0e1726;
            stroke: #f87171;
            stroke-width: 2;
        }

        .grp {
            fill: #64748b;
            font: 600 10px system-ui, sans-serif;
            letter-spacing: .12em;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin: -6px 0 12px;
            text-align: center;
        }

        .detail {
            margin-bottom: 14px;
        }

        @keyframes flow {
            to {
                stroke-dashoffset: -18;
            }
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                opacity: .9;
            }

            to {
                transform: scale(1.7);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .edge.ok,
            .gnode.problem .pulse {
                animation: none;
            }
        }

        @media (max-width: 520px) {
            td:first-child {
                width: auto;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div id="sidebar"></div>
        <div class="content">
            <header>
                <h2>Trust Graph</h2>
                <form id="f"><input id="ref" placeholder="Invoice number, e.g. NW-1001"
                        aria-label="Invoice number"><button>Show</button></form>
            </header>
            <main>
                <div id="life"></div>
                <div id="out">
                    <p class="sub">Enter an invoice number, or open this page from an invoice or payment in the console.
                    </p>
                </div>
                <div id="report"></div>
            </main>
        </div>
    </div>
    <script src="layout.js"></script>
    <script src="pm.js"></script>
    <script src="ui.js"></script>
    <script src="lifecycle.js"></script>
    <script src="report.js"></script>
    <script>
        const API = (location.protocol === "file:" || (["localhost", "127.0.0.1"].includes(location.hostname) && location.port !== "8000")) ? "http://localhost:8000" : location.origin;   // dev: backend on :8000; hosted: same origin as the page
        const $ = id => document.getElementById(id);
        const SYMBOL = { ok: "✓", problem: "✗", pending: "…" };
        const WORD = { ok: "Verified", problem: "Problem: missing or mismatch", pending: "Not reached yet" };
        const VERDICT = {
            complete: "Complete: every link in the chain is proven.",
            incomplete: "In progress: no problems so far, later steps have not happened yet.",
            broken: "Broken: at least one link is missing or does not match. Do not release or trust this until it is explained."
        };
        function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

        function nodeCard(n, i) {
            const card = el("div", "card");
            const head = el("div", "head");
            head.appendChild(el("h2", "", `${i + 1}. ${n.title}`));
            head.appendChild(el("span", "state", WORD[n.state]));
            head.appendChild(el("span", "tag " + n.kind, n.kind === "ai" ? "AI suggestion" : "Verified fact"));
            card.appendChild(head);
            card.appendChild(el("p", "summ", n.summary));
            if (n.problems.length > 1) {
                const ul = el("ul", "probs"); n.problems.forEach(p => ul.appendChild(el("li", "", p))); card.appendChild(ul);
            }
            if (n.ai) {
                card.appendChild(el("div", "ai-box", `AI suggestion: ${n.ai.suggestion || "none"}` + (n.ai.model ? ` (${n.ai.model})` : "") + `. ${n.ai.note}`));
            }
            if (n.facts.length || n.records.length) {
                const det = el("details"); det.open = true; det.appendChild(el("summary", "", "Evidence and record ids"));
                if (n.facts.length) {
                    const t = el("table");
                    n.facts.forEach(f => { const tr = el("tr"); tr.appendChild(el("td", "", f.label)); tr.appendChild(el("td", "", f.value)); t.appendChild(tr); });
                    det.appendChild(t);
                }
                if (n.records.length) {
                    const t = el("table");
                    n.records.forEach(r => { const tr = el("tr"); tr.appendChild(el("td", "", r.type)); tr.appendChild(el("td", "rec", r.id)); t.appendChild(tr); });
                    det.appendChild(t);
                }
                card.appendChild(det);
            }
            return card;
        }

        function render(d) {
            const out = $("out"); out.textContent = "";
            const s = el("div", "summary");
            s.appendChild(el("h1", "", `Invoice ${d.invoice_number}: ${d.amount} ${d.currency}`));
            s.appendChild(el("div", "sub", `${d.vendor} · status: ${d.status}` + (d.payment_id ? ` · payment ${d.payment_id.slice(0, 8)}…` : " · not paid yet")));
            s.appendChild(el("div", "verdict " + d.verdict, VERDICT[d.verdict] || d.verdict));
            const lg = el("div", "legend");
            lg.appendChild(el("span", "tag fact", "Verified fact")); lg.appendChild(el("span", "", d.legend.fact));
            lg.appendChild(el("span", "tag ai", "AI suggestion")); lg.appendChild(el("span", "", d.legend.ai));
            s.appendChild(lg);
            out.appendChild(s);
            // hero: verdict ring + progress meter
            const NS = "http://www.w3.org/2000/svg";
            const sv = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in (attrs || {})) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };
            const VCOL = { complete: "#0b6b4f", incomplete: "#6b6a63", broken: "#b3261e" };
            const c = d.counts || { ok: 0, problem: 0, pending: 0 }, total = d.chain.length;
            const hero = el("div", "hero");
            const ring = sv("svg", { class: "ring", viewBox: "0 0 64 64", "aria-hidden": "true" });
            ring.appendChild(sv("circle", { cx: 32, cy: 32, r: 27, fill: "none", stroke: "#e4e2da", "stroke-width": 7 }));
            const circ = 2 * Math.PI * 27;
            ring.appendChild(sv("circle", {
                cx: 32, cy: 32, r: 27, fill: "none", stroke: VCOL[d.verdict] || "#6b6a63", "stroke-width": 7, "stroke-linecap": "round",
                "stroke-dasharray": `${circ * (c.ok / total)} ${circ}`, transform: "rotate(-90 32 32)"
            }));
            ring.appendChild(sv("text", { x: 32, y: 33, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 17, "font-weight": 700, fill: VCOL[d.verdict] || "#6b6a63" }, `${c.ok}/${total}`));
            hero.appendChild(ring);
            const meter = el("div", "meter");
            meter.appendChild(el("div", "nums", "Links in the evidence chain"));
            const bar = el("div", "bar");
            [["ok", "#0b6b4f"], ["problem", "#b3261e"], ["pending", "#cfcdc4"]].forEach(([k, col]) => { const i = el("i"); i.style.width = (100 * (c[k] || 0) / total) + "%"; i.style.background = col; bar.appendChild(i); });
            meter.appendChild(bar);
            meter.appendChild(el("div", "nums", `${c.ok} proven \u00b7 ${c.problem} problem \u00b7 ${c.pending} not reached yet`));
            hero.appendChild(meter);
            out.appendChild(hero);

            // the graph: three inputs converge on the invoice, then a straight run to reconcile
            const POS = {
                vendor: [110, 105], po: [110, 260], delivery: [110, 415], invoice: [350, 260], approval: [545, 260], payout: [735, 260],
                webhook: [900, 110], ledger: [900, 260], reconcile: [900, 410]
            };
            const ICON = {
                vendor: ["M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z", "M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2", "M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2", "M10 6h4", "M10 10h4", "M10 14h4", "M10 18h4"],
                po: ["M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z", "M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2", "M12 11h4", "M12 16h4", "M8 11h.01", "M8 16h.01"],
                delivery: ["m7.5 4.27 9 5.15", "M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z", "m3.3 7 8.7 5 8.7-5", "M12 22V12"],
                invoice: ["M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z", "M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8", "M12 17.5v-11"],
                approval: ["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z", "m9 12 2 2 4-4"],
                payout: ["M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z", "M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z", "M6 12h.01", "M18 12h.01"],
                webhook: ["M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9", "M10.3 21a1.94 1.94 0 0 0 3.4 0"],
                ledger: ["M12 7v14", "M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"],
                reconcile: ["M12 3v18", "m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z", "m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z", "M7 21h10", "M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"]
            };
            const EDGES = [["vendor", "invoice"], ["po", "invoice"], ["delivery", "invoice"], ["invoice", "approval"], ["approval", "payout"],
            ["payout", "webhook"], ["webhook", "ledger"], ["ledger", "reconcile"]];
            const byKey = {}; d.chain.forEach((n, i) => { byKey[n.key] = { n, i }; });
            const svg = sv("svg", { viewBox: "0 0 1000 500", role: "img", "aria-label": "Evidence graph from vendor to reconcile" });
            svg.appendChild(sv("text", { class: "grp", x: 110, y: 28, "text-anchor": "middle" }, "WHAT WE CHECKED AGAINST"));
            svg.appendChild(sv("text", { class: "grp", x: 545, y: 168, "text-anchor": "middle" }, "WHO LET THE MONEY GO"));
            svg.appendChild(sv("text", { class: "grp", x: 900, y: 28, "text-anchor": "middle" }, "PROOF IT HAPPENED"));
            EDGES.forEach(([a, b]) => {
                if (!byKey[a] || !byKey[b]) return;
                const A = POS[a], B = POS[b], sa = byKey[a].n.state, sb = byKey[b].n.state;
                const toInvoice = b === "invoice";
                const bad = toInvoice ? sa === "problem" : (sa === "problem" || sb === "problem");
                const cls = bad ? "bad" : (sa === "ok" && sb === "ok") ? "ok" : (sa === "ok" && toInvoice && sb === "problem") ? "ok" : "wait";
                const mx = (A[0] + B[0]) / 2;
                const path = sv("path", { class: "edge " + cls, d: `M ${A[0]} ${A[1]} C ${mx} ${A[1]}, ${mx} ${B[1]}, ${B[0]} ${B[1]}` });
                svg.appendChild(path);
                if (bad) {
                    const my = (A[1] + B[1]) / 2, g = sv("g");
                    g.appendChild(sv("circle", { class: "crossbg", cx: mx, cy: my, r: 13 }));
                    g.appendChild(sv("path", { class: "cross", d: `M ${mx - 5} ${my - 5} L ${mx + 5} ${my + 5} M ${mx + 5} ${my - 5} L ${mx - 5} ${my + 5}` }));
                    svg.appendChild(g);
                }
            });
            const detail = el("div", "detail");
            const nodeEls = [];
            const select = key => {
                nodeEls.forEach(g => g.classList.toggle("sel", g.dataset.key === key));
                detail.textContent = ""; detail.appendChild(nodeCard(byKey[key].n, byKey[key].i));
            };
            d.chain.forEach(n => {
                const [x, y] = POS[n.key] || [500, 250];
                const g = sv("g", { class: "gnode " + n.state, tabindex: 0, role: "button", "aria-label": `${n.title}: ${WORD[n.state]}` });
                g.dataset.key = n.key;
                g.appendChild(sv("circle", { class: "halo", cx: x, cy: y, r: 50 }));
                if (n.state === "problem") g.appendChild(sv("circle", { class: "pulse", cx: x, cy: y, r: 36 }));
                g.appendChild(sv("circle", { class: "core", cx: x, cy: y, r: 36 }));
                g.appendChild(sv("circle", { class: "sel-ring", cx: x, cy: y, r: 45 }));
                const ic = sv("g", { class: "ico", transform: `translate(${x - 15} ${y - 15}) scale(1.25)` });
                (ICON[n.key] || []).forEach(p => ic.appendChild(sv("path", { d: p })));
                g.appendChild(ic);
                g.appendChild(sv("text", { class: "t", x, y: y + 60 }, n.title));
                g.appendChild(sv("text", { class: "s", x, y: y + 75 }, n.state === "ok" ? "VERIFIED" : n.state === "problem" ? "PROBLEM" : "NOT REACHED YET"));
                if (n.kind === "ai") {
                    const b = sv("g", { class: "aibadge" });
                    b.appendChild(sv("rect", { x: x + 18, y: y - 48, width: 30, height: 18, rx: 9 }));
                    b.appendChild(sv("text", { x: x + 33, y: y - 39 }, "AI"));
                    g.appendChild(b);
                }
                g.addEventListener("click", () => select(n.key));
                g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.key); } });
                svg.appendChild(g); nodeEls.push(g);
            });
            const stage = el("div", "stage"); stage.appendChild(svg);
            out.appendChild(stage);
            out.appendChild(el("div", "hint", "Click any node to see the evidence. Green moving line: proven. Red cut line: broken. Grey dots: not reached yet. Amber AI tag: a suggestion, never a fact."));
            out.appendChild(detail);
            const firstBad = d.chain.find(n => n.state === "problem");
            const lastOk = [...d.chain].reverse().find(n => n.state === "ok") || d.chain[0];
            select((firstBad || lastOk).key);
        }

        function renderReport(r) { PMReport.render($("report"), r); }
        function loadLifecycle(ref) { PMLife.mount($("life"), ref, API); }
        async function loadReport(ref) {
            const out = $("report"); out.textContent = "";
            try {
                const r = await fetch(`${API}/report/invoice/${encodeURIComponent(ref)}`);
                if (r.ok) renderReport(await r.json());
            } catch (e) { }
        }

        async function load(kind, ref) {
            $("out").textContent = "Loading…";
            try {
                const r = await fetch(`${API}/trust/${kind}/${encodeURIComponent(ref)}`);
                if (r.status === 401) { PM.clear(); location.replace("login.html"); return; }
                if (!r.ok) { const e = el("div", "err", r.status === 404 ? "Nothing found for that reference in your company." : `Error ${r.status}`); $("out").textContent = ""; $("out").appendChild(e); return; }
                const d = await r.json(); render(d); loadReport(d.invoice_id); loadLifecycle(d.invoice_id);
            } catch (e) { const x = el("div", "err", "Cannot reach the API."); $("out").textContent = ""; $("out").appendChild(x); }
        }
        $("f").onsubmit = ev => { ev.preventDefault(); const v = $("ref").value.trim(); if (v) { history.replaceState(null, "", "?invoice=" + encodeURIComponent(v)); load("invoice", v); } };
        const q = new URLSearchParams(location.search);
        if (q.get("payment")) load("payment", q.get("payment"));
        else if (q.get("invoice")) { $("ref").value = q.get("invoice"); load("invoice", q.get("invoice")); }
    </script>
</body>
