<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="layout.css">
    <title>PayMaster: Vendors, POs, Deliveries</title>
    <style>
        :root {
            --line: #e4e2da;
            --muted: #6b6a63;
            --brand: #0b6b4f;
            --brand-d: #08543e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f2;
            color: #1c1b18;
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .main {
            padding: 22px 28px;
            min-width: 0;
            max-width: 1500px;
        }

        .main h1 {
            font-size: 22px;
            margin: 0 0 16px;
        }

        section {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin: 0 0 16px;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f1efe8;
            text-align: left;
            padding: 8px;
            font-weight: 600;
        }

        td {
            text-align: left;
            padding: 8px;
            border-top: 1px solid var(--line);
        }

        form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        input,
        select {
            font: inherit;
            padding: 7px 9px;
            border: 1px solid #cfcdc4;
            border-radius: 8px;
            background: #fff;
        }

        button {
            font: inherit;
            font-weight: 500;
            padding: 7px 14px;
            background: var(--brand);
            color: #fff;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: var(--brand-d);
        }

        button.ghost {
            background: none;
            color: var(--brand);
            border: 1px solid var(--brand);
            padding: 2px 10px;
            font-size: 12px;
        }

        button.ghost:hover {
            background: var(--brand);
            color: #fff;
        }

        .msg {
            color: #b4531a;
            min-height: 1.2em;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .ok {
            color: var(--brand);
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .tabs button {
            background: none;
            color: var(--muted);
            border-radius: 8px 8px 0 0;
            padding: 8px 16px;
            border-bottom: 2px solid transparent;
        }

        .tabs button:hover {
            background: #ebeae4;
            color: #1c1b18;
        }

        .tabs button.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
            font-weight: 600;
        }

        .tab {
            display: none;
        }

        .tab.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="app">
        <div id="sidebar"></div>
        <main class="main">
            <h1>Vendors, POs, Deliveries</h1>
            <div class="tabs">
                <button data-tab="vendors" class="active">Vendors</button>
                <button data-tab="pos">Purchase orders</button>
                <button data-tab="deliveries">Deliveries</button>
            </div>
            <section class="tab active" id="tab-vendors">
                <h3>Vendors</h3>
                <form id="vform" class="admin-only">
                    <input id="vname" placeholder="Name" required>
                    <input id="vcountry" placeholder="Country" size="10" required>
                    <input id="vemail" type="email" placeholder="Payout (PayPal) email" required>
                    <button>Add vendor</button>
                </form>
                <div class="msg" id="vmsg"></div>
                <div id="pending" class="admin-only"></div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Country</th>
                            <th>Payout email</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="vbody"></tbody>
                </table>
            </section>

            <section class="tab" id="tab-pos">
                <h3>Purchase orders</h3>
                <form id="pform" class="admin-only">
                    <select id="pvendor" required></select>
                    <input id="pnum" placeholder="PO number" size="10" required>
                    <input id="pamt" type="number" step="0.01" min="0.01" placeholder="Amount" required>
                    <input id="pcur" value="USD" size="4" maxlength="3">
                    <input id="pqty" type="number" step="0.001" min="0.001" placeholder="Quantity (optional)" size="12">
                    <button>Create PO</button>
                </form>
                <div class="msg" id="pmsg"></div>
                <table>
                    <thead>
                        <tr>
                            <th>PO</th>
                            <th>Vendor</th>
                            <th>Amount</th>
                            <th>Qty</th>
                            <th>Delivered</th>
                            <th>Status</th>
                            <th></th>
                            <th>Files</th>
                        </tr>
                    </thead>
                    <tbody id="pbody"></tbody>
                </table>
            </section>

            <section class="tab" id="tab-deliveries">
                <h3>Deliveries</h3>
                <form id="dform" class="admin-only">
                    <select id="dpo" required></select>
                    <input id="ddesc" placeholder="What arrived" size="24" required>
                    <input id="damt" type="number" step="0.01" min="0.01" placeholder="Value" required>
                    <input id="dqty" type="number" step="0.001" min="0.001" placeholder="Quantity (optional)" size="12">
                    <button>Record delivery</button>
                </form>
                <div class="msg" id="dmsg"></div>
                <table>
                    <thead>
                        <tr>
                            <th>PO</th>
                            <th>Description</th>
                            <th>Value</th>
                            <th>Qty</th>
                            <th>Received</th>

                            <th class="admin-only"></th>
                            <th>Files</th>
                        </tr>
                    </thead>
                    <tbody id="dbody"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="layout.js"></script>
    <script src="pm.js"></script>
    <script src="ui.js"></script>
    <script>
        const API = "http://localhost:8000";
        const $ = id => document.getElementById(id);
        const user = JSON.parse(localStorage.getItem("pm_user") || "null");
        function logout() { PM.logout(); }
        if (!PM.signedIn()) location.replace("login.html");
        else if (user && !user.company_id) location.replace("company.html");

        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const money = (n, cur) => Number(n).toFixed(2) + (cur ? " " + cur : "");

        async function call(path, method, body) {
            const r = await fetch(API + path, {
                method: method || "GET",
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined,
            });
            if (r.status === 401) { logout(); throw new Error("Session expired"); }
            const data = await r.json().catch(() => ({}));
            if (!r.ok) {
                const d = data.detail;
                throw new Error(typeof d === "string" ? d : "Please check the values you entered");
            }
            return data;
        }
        function fail(id, e) { const m = e.message === "Failed to fetch" ? "Cannot reach the API" : e.message; $(id).className = "msg"; $(id).textContent = ""; PM.toast(m, "error"); }
        function done(id, text) { $(id).className = "msg ok"; $(id).textContent = ""; PM.toast(text, "ok"); }

        let vendors = [];
        async function loadVendors() {
            vendors = (await call("/vendors")).items;
            $("vbody").innerHTML = vendors.map(v => `<tr><td>${esc(v.name)}${v.active ? "" : " (inactive)"}</td><td>${esc(v.country)}</td><td>${esc(v.payout_email)}</td>
            <td class="admin-only"><button class="ghost" data-id="${esc(v.id)}">Change email</button>
            <button class="ghost" data-vedit="${esc(v.id)}" data-name="${esc(v.name)}" data-country="${esc(v.country)}">Edit</button>
            <button class="ghost" data-vtoggle="${esc(v.id)}" data-active="${v.active}">${v.active ? "Deactivate" : "Reactivate"}</button>
            <button class="ghost" data-vdel="${esc(v.id)}">Delete</button></td></tr>`).join("");
            $("pvendor").innerHTML = vendors.filter(v => v.active).map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
        }
        async function loadChanges() {
            let list;
            try { list = await call("/changes"); } catch { return; }   // non-admins just see nothing
            $("pending").innerHTML = list.length ? "<h3>Waiting for approval</h3>" + list.map(c =>
                `<p>${esc(c.vendor)}: payout email ${esc(c.old_email || "none")} to <b>${esc(c.new_email)}</b>, asked by ${esc(c.requested_by)}.
                ${c.mine ? "" : `<button data-approve="${esc(c.id)}">Approve</button> `}<button class="ghost" data-reject="${esc(c.id)}">${c.mine ? "Cancel" : "Reject"}</button></p>`).join("") : "";
        }
        let ATT = [];
        function fileCell(type, id) {
            const mine = ATT.filter(a => a.entity_type === type && a.entity_id === id);
            return mine.map(a => `<a href="#" data-open="${esc(a.id)}">${esc(a.filename)}</a> <button class="ghost admin-only" data-adel="${esc(a.id)}">x</button>`).join("<br>")
                + `<div class="admin-only"><button class="ghost" data-attach="${type}:${esc(id)}">Attach file</button></div>`;
        }
        async function loadPOs() {
            const pos = (await call("/pos")).items;
            $("pbody").innerHTML = pos.map(p => `<tr><td>${esc(p.po_number)}</td><td>${esc(p.vendor)}</td><td>${money(p.amount, p.currency)}</td><td>${p.quantity == null ? "" : esc(p.quantity)}</td>
            <td>${money(p.delivered)}</td><td>${esc(p.status)}</td>
            <td class="admin-only">${p.status !== "cancelled" && p.delivered < p.amount ? `<button class="ghost" data-po="${esc(p.id)}">Mark fully delivered</button> ` : ""}
            ${p.status !== "cancelled" ? `<button class="ghost" data-pedit="${esc(p.id)}" data-amt="${esc(p.amount)}" data-cur="${esc(p.currency)}" data-qty="${p.quantity == null ? "" : esc(p.quantity)}">Edit</button> <button class="ghost" data-pcancel="${esc(p.id)}">Cancel</button>` : ""}</td><td>${fileCell("purchase_order", p.id)}</td></tr>`).join("");
            $("dpo").innerHTML = pos.map(p => `<option value="${esc(p.id)}">${esc(p.po_number)} (${esc(p.vendor)})</option>`).join("");
        }
        async function loadDeliveries() {
            const ds = (await call("/deliveries")).items;
            $("dbody").innerHTML = ds.map(d => `<tr><td>${esc(d.po_number)}</td><td>${esc(d.description)}</td><td>${money(d.amount)}</td><td>${d.quantity == null ? "" : esc(d.quantity)}</td>
            <td>${esc(d.received_at.slice(0, 10))}</td>
            <td class="admin-only"><button class="ghost" data-dedit="${esc(d.id)}" data-desc="${esc(d.description)}" data-amt="${esc(d.amount)}" data-qty="${d.quantity == null ? "" : esc(d.quantity)}">Edit</button>
            <button class="ghost" data-ddel="${esc(d.id)}">Delete</button></td><td>${fileCell("delivery", d.id)}</td></tr>`).join("");
        }
        async function refresh() {
            try { await loadVendors(); await loadChanges(); ATT = (await call("/attachments")).items; await loadPOs(); await loadDeliveries(); }
            catch (e) { fail("vmsg", e); }
        }

        $("vform").onsubmit = async e => {
            e.preventDefault(); $("vmsg").textContent = "";
            try {
                await call("/vendors", "POST", { name: $("vname").value, country: $("vcountry").value, payout_email: $("vemail").value });
                $("vform").reset(); done("vmsg", "Vendor added"); await refresh();
            } catch (err) { fail("vmsg", err); }
        };
        $("vbody").onclick = async e => {
            const t = e.target.dataset || {};
            try {
                if (t.id) {
                    const a = await PM.ask("Change payout email", [{ name: "email", label: "New payout email", required: true, placeholder: "ap@vendor.com" }], { okText: "Request change", intro: "Payouts for this vendor will go to the new address once it is applied." }); if (!a) return; const email = a.email;
                    await call("/vendors/" + t.id, "POST", { payout_email: email.trim() });
                    done("vmsg", "Done. If you have a second admin, they must approve it first; otherwise it was applied now.");
                } else if (t.vedit) {
                    const a = await PM.ask("Edit vendor", [{ name: "name", label: "Name", value: t.name, required: true }, { name: "country", label: "Country", value: t.country, required: true }], { okText: "Save" }); if (!a) return;
                    const { name, country } = a;
                    await call("/vendors/" + t.vedit, "POST", { name, country });
                    done("vmsg", "Vendor updated");
                } else if (t.vtoggle || t.vdel) {
                    const act = t.vdel ? "delete" : (t.active === "true" ? "deactivate" : "reactivate");
                    const reason = await PM.askReason(`${act[0].toUpperCase() + act.slice(1)} this vendor`, { label: `Why are you going to ${act} this vendor?`, okText: act[0].toUpperCase() + act.slice(1), danger: act === "delete" }); if (!reason) return;
                    await call(`/vendors/${t.vdel || t.vtoggle}/${act}`, "POST", { reason });
                    done("vmsg", "Vendor " + act + "d");
                } else return;
                await refresh();
            } catch (err) { fail("vmsg", err); }
        };
        $("pending").onclick = async e => {
            const a = e.target.dataset && e.target.dataset.approve, r = e.target.dataset && e.target.dataset.reject;
            const id = a || r; if (!id) return;
            try { await call(`/changes/${id}/${a ? "approve" : "reject"}`, "POST"); done("vmsg", a ? "Approved. The payout email is changed." : "Request closed."); await refresh(); }
            catch (err) { fail("vmsg", err); }
        };
        $("pbody").onclick = async e => {
            const t = e.target.dataset || {};
            try {
                if (t.po) {
                    if (!(await PM.confirm("This records a delivery for everything not yet delivered on this PO.", { title: "Mark PO as fully delivered", okText: "Mark delivered" }))) return;
                    await call(`/pos/${t.po}/deliver-all`, "POST"); done("pmsg", "Marked fully delivered");
                } else if (t.pedit) {
                    const a = await PM.ask("Edit purchase order", [
                        { name: "amount", label: "Amount", value: t.amt, required: true, inputmode: "decimal" },
                        { name: "currency", label: "Currency", value: t.cur, required: true },
                        { name: "quantity", label: "Quantity", value: t.qty, hint: "Leave blank for none", inputmode: "decimal" },
                        { name: "reason", label: "Why are you changing it?", min: 10, textarea: true, hint: "Written to the audit log." }], { okText: "Save changes" }); if (!a) return;
                    const { amount, currency, quantity, reason } = a;
                    await call(`/pos/${t.pedit}/edit`, "POST", { amount, currency, quantity: quantity || null, reason });
                    done("pmsg", "PO updated");
                } else if (t.pcancel) {
                    const reason = await PM.askReason("Cancel this purchase order", { label: "Why are you cancelling it?", okText: "Cancel PO", cancelText: "Keep it", danger: true }); if (!reason) return;
                    await call(`/pos/${t.pcancel}/cancel`, "POST", { reason });
                    done("pmsg", "PO cancelled");
                } else return;
                await refresh();
            } catch (err) { fail("pmsg", err); }
        };
        $("pform").onsubmit = async e => {
            e.preventDefault(); $("pmsg").textContent = "";
            try {
                await call("/pos", "POST", { vendor_id: $("pvendor").value, po_number: $("pnum").value, amount: $("pamt").value, currency: $("pcur").value, quantity: $("pqty").value || null });
                $("pnum").value = ""; $("pamt").value = ""; $("pqty").value = ""; done("pmsg", "PO created"); await refresh();
            } catch (err) { fail("pmsg", err); }
        };
        $("dform").onsubmit = async e => {
            e.preventDefault(); $("dmsg").textContent = "";
            try {
                await call(`/pos/${$("dpo").value}/deliveries`, "POST", { description: $("ddesc").value, amount: $("damt").value, quantity: $("dqty").value || null });
                $("ddesc").value = ""; $("damt").value = ""; $("dqty").value = ""; done("dmsg", "Delivery recorded"); await refresh();
            } catch (err) { fail("dmsg", err); }
        };
        $("dbody").onclick = async e => {
            const t = e.target.dataset || {};
            try {
                if (t.dedit) {
                    const a = await PM.ask("Edit delivery", [
                        { name: "description", label: "What arrived", value: t.desc, required: true },
                        { name: "amount", label: "Value", value: t.amt, required: true, inputmode: "decimal" },
                        { name: "quantity", label: "Quantity", value: t.qty, hint: "Leave blank for none", inputmode: "decimal" },
                        { name: "reason", label: "Why are you changing it?", min: 10, textarea: true, hint: "Written to the audit log." }], { okText: "Save changes" }); if (!a) return;
                    const { description, amount, quantity, reason } = a;
                    await call(`/deliveries/${t.dedit}/edit`, "POST", { description, amount, quantity: quantity || null, reason });
                    done("dmsg", "Delivery updated"); await refresh();
                } else if (t.ddel) {
                    const reason = await PM.askReason("Delete this delivery", { label: "Why are you deleting it?", okText: "Delete", danger: true }); if (!reason) return;
                    await call(`/deliveries/${t.ddel}/delete`, "POST", { reason });
                    done("dmsg", "Delivery deleted"); await refresh();
                }
            } catch (err) { fail("dmsg", err); }
        };
        refresh();
        document.addEventListener("click", async e => {
            const t = e.target.dataset || {};
            try {
                if (t.open) {
                    e.preventDefault();
                    const r = await fetch(`${API}/attachments/${t.open}`);
                    if (!r.ok) throw new Error("Could not open the file");
                    window.open(URL.createObjectURL(await r.blob()), "_blank");
                } else if (t.attach) {
                    const [type, id] = t.attach.split(":");
                    const inp = document.createElement("input");
                    inp.type = "file"; inp.accept = ".pdf,.png,.jpg,.jpeg";
                    inp.onchange = async () => {
                        if (!inp.files[0]) return;
                        const fd = new FormData(); fd.append("file", inp.files[0]);
                        try {
                            const r = await fetch(API + (type === "delivery" ? `/deliveries/${id}/attachments` : `/pos/${id}/attachments`),
                                { method: "POST", body: fd });
                            const d = await r.json().catch(() => ({}));
                            if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Upload failed");
                            await refresh();
                        } catch (err) { PM.toast(err.message === "Failed to fetch" ? "Cannot reach the API" : err.message, "error"); }
                    };
                    inp.click();
                } else if (t.adel) {
                    const reason = await PM.askReason("Remove this file", { label: "Why are you removing it?", okText: "Remove", danger: true }); if (!reason) return;
                    await call(`/attachments/${t.adel}/delete`, "POST", { reason });
                    await refresh();
                }
            } catch (err) { PM.toast(err.message === "Failed to fetch" ? "Cannot reach the API" : err.message, "error"); }
        });

        function showTab(t) {
            document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
            document.querySelectorAll(".tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + t));
        }
        document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
            history.replaceState(null, "", "#" + b.dataset.tab);
            showTab(b.dataset.tab);
        }));
        if (location.hash) showTab(location.hash.slice(1));
    </script>
</body>

</html>
