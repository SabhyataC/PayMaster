<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayMaster: Vendors, POs, Deliveries</title>
    <style>
        :root {
            --line: #e4e2da;
            --muted: #6b6a63;
            --brand: #0b6b4f;
            --brand-d: #08543e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f2;
            color: #1c1b18;
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .app {
            display: grid;
            grid-template-columns: 230px 1fr;
            min-height: 100vh;
        }

        .side {
            background: #10231c;
            color: #cfe3da;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            font-weight: 700;
            font-size: 19px;
            color: #fff;
            padding: 4px 10px 20px;
        }

        .brand span {
            color: #4ad4a0;
        }

        .nav a {
            display: block;
            padding: 9px 12px;
            border-radius: 8px;
            color: #cfe3da;
            text-decoration: none;
            margin-bottom: 3px;
        }

        .nav a:hover {
            background: #1a3a2f;
        }

        .nav a.active {
            background: var(--brand);
            color: #fff;
        }

        .side .foot {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #1f3d32;
        }

        .side .foot button {
            width: 100%;
            background: none;
            border: 1px solid #3a5a4d;
            color: #cfe3da;
        }

        .main {
            padding: 22px 28px;
            min-width: 0;
            max-width: 1100px;
        }

        .main h1 {
            font-size: 22px;
            margin: 0 0 16px;
        }

        section {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin: 0 0 16px;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f1efe8;
            text-align: left;
            padding: 8px;
            font-weight: 600;
        }

        td {
            text-align: left;
            padding: 8px;
            border-top: 1px solid var(--line);
        }

        form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        input,
        select {
            font: inherit;
            padding: 7px 9px;
            border: 1px solid #cfcdc4;
            border-radius: 8px;
            background: #fff;
        }

        button {
            font: inherit;
            font-weight: 500;
            padding: 7px 14px;
            background: var(--brand);
            color: #fff;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: var(--brand-d);
        }

        button.ghost {
            background: none;
            color: var(--brand);
            border: 1px solid var(--brand);
            padding: 2px 10px;
            font-size: 12px;
        }

        button.ghost:hover {
            background: var(--brand);
            color: #fff;
        }

        .msg {
            color: #b4531a;
            min-height: 1.2em;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .ok {
            color: var(--brand);
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .tabs button {
            background: none;
            color: var(--muted);
            border-radius: 8px 8px 0 0;
            padding: 8px 16px;
            border-bottom: 2px solid transparent;
        }

        .tabs button:hover {
            background: #ebeae4;
            color: #1c1b18;
        }

        .tabs button.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
            font-weight: 600;
        }

        .tab {
            display: none;
        }

        .tab.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="brand">Pay<span>Master</span></div>
            <nav class="nav">
                <a href="index.html#overview">Overview</a>
                <a href="index.html#invoices">Invoices</a>
                <a href="index.html#review">Review queue</a>
                <a href="index.html#exceptions">Exceptions</a>
                <a href="index.html#payments">Payments &amp; ledger</a>
                <a href="index.html#assistant">Ask &amp; Advise</a>
                <a href="vendors.html" class="active">Vendors &amp; POs</a>
                <a href="team.html" class="admin-only">Team &amp; settings</a>
                <a href="account.html">My account</a>
            </nav>
            <div class="foot"><button id="logout">Log out</button></div>
        </aside>
        <main class="main">
            <h1>Vendors, POs, Deliveries</h1>
            <div class="tabs">
                <button data-tab="vendors" class="active">Vendors</button>
                <button data-tab="pos">Purchase orders</button>
                <button data-tab="deliveries">Deliveries</button>
            </div>
            <section class="tab active" id="tab-vendors">
                <h3>Vendors</h3>
                <form id="vform" class="admin-only">
                    <input id="vname" placeholder="Name" required>
                    <input id="vcountry" placeholder="Country" size="10" required>
                    <input id="vemail" type="email" placeholder="Payout (PayPal) email" required>
                    <button>Add vendor</button>
                </form>
                <div class="msg" id="vmsg"></div>
                <div id="pending" class="admin-only"></div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Country</th>
                            <th>Payout email</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="vbody"></tbody>
                </table>
            </section>

            <section class="tab" id="tab-pos">
                <h3>Purchase orders</h3>
                <form id="pform" class="admin-only">
                    <select id="pvendor" required></select>
                    <input id="pnum" placeholder="PO number" size="10" required>
                    <input id="pamt" type="number" step="0.01" min="0.01" placeholder="Amount" required>
                    <input id="pcur" value="USD" size="4" maxlength="3">
                    <input id="pqty" type="number" step="0.001" min="0.001" placeholder="Quantity (optional)" size="12">
                    <button>Create PO</button>
                </form>
                <div class="msg" id="pmsg"></div>
                <table>
                    <thead>
                        <tr>
                            <th>PO</th>
                            <th>Vendor</th>
                            <th>Amount</th>
                            <th>Qty</th>
                            <th>Delivered</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="pbody"></tbody>
                </table>
            </section>

            <section class="tab" id="tab-deliveries">
                <h3>Deliveries</h3>
                <form id="dform" class="admin-only">
                    <select id="dpo" required></select>
                    <input id="ddesc" placeholder="What arrived" size="24" required>
                    <input id="damt" type="number" step="0.01" min="0.01" placeholder="Value" required>
                    <input id="dqty" type="number" step="0.001" min="0.001" placeholder="Quantity (optional)" size="12">
                    <button>Record delivery</button>
                </form>
                <div class="msg" id="dmsg"></div>
                <table>
                    <thead>
                        <tr>
                            <th>PO</th>
                            <th>Description</th>
                            <th>Value</th>
                            <th>Qty</th>
                            <th>Received</th>
                        </tr>
                    </thead>
                    <tbody id="dbody"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="pm.js"></script>
    <script>
        const API = "http://localhost:8000";
        const $ = id => document.getElementById(id);
        const user = JSON.parse(localStorage.getItem("pm_user") || "null");
        function logout() { PM.logout(); }
        if (!PM.signedIn()) location.replace("login.html");
        else if (user && !user.company_id) location.replace("company.html");
        $("logout").onclick = logout;

        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const money = (n, cur) => Number(n).toFixed(2) + (cur ? " " + cur : "");

        async function call(path, method, body) {
            const r = await fetch(API + path, {
                method: method || "GET",
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined,
            });
            if (r.status === 401) { logout(); throw new Error("Session expired"); }
            const data = await r.json().catch(() => ({}));
            if (!r.ok) {
                const d = data.detail;
                throw new Error(typeof d === "string" ? d : "Please check the values you entered");
            }
            return data;
        }
        function fail(id, e) { $(id).className = "msg"; $(id).textContent = e.message === "Failed to fetch" ? "Cannot reach the API" : e.message; }
        function done(id, text) { $(id).className = "msg ok"; $(id).textContent = text; }

        let vendors = [];
        async function loadVendors() {
            vendors = (await call("/vendors")).items;
            $("vbody").innerHTML = vendors.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.country)}</td><td>${esc(v.payout_email)}</td>
            <td class="admin-only"><button class="ghost" data-id="${esc(v.id)}">Change email</button></td></tr>`).join("");
            $("pvendor").innerHTML = vendors.map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
        }
        async function loadChanges() {
            let list;
            try { list = await call("/changes"); } catch { return; }   // non-admins just see nothing
            $("pending").innerHTML = list.length ? "<h3>Waiting for approval</h3>" + list.map(c =>
                `<p>${esc(c.vendor)}: payout email ${esc(c.old_email || "none")} to <b>${esc(c.new_email)}</b>, asked by ${esc(c.requested_by)}.
                ${c.mine ? "" : `<button data-approve="${esc(c.id)}">Approve</button> `}<button class="ghost" data-reject="${esc(c.id)}">${c.mine ? "Cancel" : "Reject"}</button></p>`).join("") : "";
        }
        async function loadPOs() {
            const pos = (await call("/pos")).items;
            $("pbody").innerHTML = pos.map(p => `<tr><td>${esc(p.po_number)}</td><td>${esc(p.vendor)}</td><td>${money(p.amount, p.currency)}</td><td>${p.quantity == null ? "" : esc(p.quantity)}</td>
            <td>${money(p.delivered)}</td><td>${esc(p.status)}</td>
            <td class="admin-only">${p.delivered < p.amount ? `<button class="ghost" data-po="${esc(p.id)}">Mark fully delivered</button>` : ""}</td></tr>`).join("");
            $("dpo").innerHTML = pos.map(p => `<option value="${esc(p.id)}">${esc(p.po_number)} (${esc(p.vendor)})</option>`).join("");
        }
        async function loadDeliveries() {
            const ds = (await call("/deliveries")).items;
            $("dbody").innerHTML = ds.map(d => `<tr><td>${esc(d.po_number)}</td><td>${esc(d.description)}</td><td>${money(d.amount)}</td><td>${d.quantity == null ? "" : esc(d.quantity)}</td>
            <td>${esc(d.received_at.slice(0, 10))}</td></tr>`).join("");
        }
        async function refresh() {
            try { await loadVendors(); await loadChanges(); await loadPOs(); await loadDeliveries(); }
            catch (e) { fail("vmsg", e); }
        }

        $("vform").onsubmit = async e => {
            e.preventDefault(); $("vmsg").textContent = "";
            try {
                await call("/vendors", "POST", { name: $("vname").value, country: $("vcountry").value, payout_email: $("vemail").value });
                $("vform").reset(); done("vmsg", "Vendor added"); await refresh();
            } catch (err) { fail("vmsg", err); }
        };
        $("vbody").onclick = async e => {
            const id = e.target.dataset && e.target.dataset.id;
            if (!id) return;
            const email = prompt("New payout email:");
            if (!email) return;
            try { await call("/vendors/" + id, "POST", { payout_email: email.trim() }); done("vmsg", "Done. If you have a second admin, they must approve it first; otherwise it was applied now."); await refresh(); }
            catch (err) { fail("vmsg", err); }
        };
        $("pending").onclick = async e => {
            const a = e.target.dataset && e.target.dataset.approve, r = e.target.dataset && e.target.dataset.reject;
            const id = a || r; if (!id) return;
            try { await call(`/changes/${id}/${a ? "approve" : "reject"}`, "POST"); done("vmsg", a ? "Approved. The payout email is changed." : "Request closed."); await refresh(); }
            catch (err) { fail("vmsg", err); }
        };
        $("pbody").onclick = async e => {
            const id = e.target.dataset && e.target.dataset.po;
            if (!id) return;
            try { await call(`/pos/${id}/deliver-all`, "POST"); done("pmsg", "Marked fully delivered"); await refresh(); }
            catch (err) { fail("pmsg", err); }
        };
        $("pform").onsubmit = async e => {
            e.preventDefault(); $("pmsg").textContent = "";
            try {
                await call("/pos", "POST", { vendor_id: $("pvendor").value, po_number: $("pnum").value, amount: $("pamt").value, currency: $("pcur").value, quantity: $("pqty").value || null });
                $("pnum").value = ""; $("pamt").value = ""; $("pqty").value = ""; done("pmsg", "PO created"); await refresh();
            } catch (err) { fail("pmsg", err); }
        };
        $("dform").onsubmit = async e => {
            e.preventDefault(); $("dmsg").textContent = "";
            try {
                await call(`/pos/${$("dpo").value}/deliveries`, "POST", { description: $("ddesc").value, amount: $("damt").value, quantity: $("dqty").value || null });
                $("ddesc").value = ""; $("damt").value = ""; $("dqty").value = ""; done("dmsg", "Delivery recorded"); await refresh();
            } catch (err) { fail("dmsg", err); }
        };
        refresh();

        function showTab(t) {
            document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
            document.querySelectorAll(".tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + t));
        }
        document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
            history.replaceState(null, "", "#" + b.dataset.tab);
            showTab(b.dataset.tab);
        }));
        if (location.hash) showTab(location.hash.slice(1));
    </script>
</body>

</html>
