<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="layout.css">
    <title>PayMaster: Reconciliation</title>
    <style>
        :root {
            --bg: #f7f6f2;
            --card: #fff;
            --line: #e4e2da;
            --ink: #1d1d1b;
            --muted: #6b6a63;
            --ok: #0b6b4f;
            --ok-bg: #e6f3ee;
            --bad: #b3261e;
            --bad-bg: #fbe9e7;
            --warn: #c77700;
            --warn-bg: #fdf0d9;
            --blue: #1f4e8c;
            --blue-bg: #e8eff9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f2;
            color: #1c1b18;
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        header a {
            color: var(--ok);
            text-decoration: none;
            font-weight: 600;
        }

        main {
            max-width: 1500px;
            margin: 0;
            padding: 22px 28px;
            min-width: 0;
        }

        h1 {
            font-size: 20px;
            margin: 4px 0 2px;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 12px;
        }

        .grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: 14px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            min-width: 0;
        }

        .card .t {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
        }

        .card .n {
            font-size: 26px;
            font-weight: 700;
            margin: 2px 0;
        }

        .card .h {
            font-size: 12px;
            color: var(--muted);
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 99px;
            background: #eeede8;
            color: #4a4a45;
        }

        .chip.good {
            background: var(--ok-bg);
            color: var(--ok);
        }

        .chip.bad {
            background: var(--bad-bg);
            color: var(--bad);
        }

        .chip.warn {
            background: var(--warn-bg);
            color: #8a5200;
        }

        .chip.blue {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .tools button,
        .tools input {
            padding: 7px 12px;
            border: 1px solid #cfcdc4;
            border-radius: 8px;
            font: inherit;
            font-size: 13px;
            background: #fff;
        }

        .tools button.on {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok);
        }

        .tools button.pri {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok);
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            font-size: 13px;
        }

        th {
            text-align: left;
            background: #faf9f5;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #eeede8;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .note {
            max-width: 320px;
            word-break: break-word;
            font-style: italic;
            color: #4a4a45;
        }

        .banner {
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .banner .ic {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 22px;
            color: #fff;
            flex: none;
        }

        .banner.in_sync {
            background: var(--ok-bg);
        }

        .banner.in_sync .ic {
            background: var(--ok);
        }

        .banner.attention {
            background: var(--bad-bg);
        }

        .banner.attention .ic {
            background: var(--bad);
        }

        .banner.empty {
            background: #eeede8;
        }

        .banner.empty .ic {
            background: #8a8a82;
        }

        .banner b {
            font-size: 17px;
            display: block;
        }

        .banner ul {
            margin: 4px 0 0 18px;
            padding: 0;
        }

        .empty {
            color: var(--muted);
            padding: 18px;
            text-align: center;
        }

        .two {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 800px) {
            .two {
                grid-template-columns: 1fr;
            }
        }

        .bar {
            height: 10px;
            background: #f1f0ea;
            border-radius: 99px;
            overflow: hidden;
            display: flex;
            margin: 6px 0;
        }

        .bar i {
            display: block;
            height: 100%;
        }

        a.lnk {
            color: var(--blue);
            text-decoration: none;
        }

        .vz-card .h {
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <!-- <header><a href="index.html">&larr; Console</a><strong>Reconciliation</strong></header> -->
    <div class="app">
        <div id="sidebar"></div>
        <main>
            <h1>Reconciliation</h1>
            <p class="sub">Do our books agree with PayPal? This page checks payments, the ledger and PayPal's
                confirmations.
            </p>
            <div id="banner"></div>
            <div class="tools"><button class="pri" id="run" type="button">Run reconcile now</button><span id="last"
                    class="sub" style="margin:0"></span></div>
            <div class="grid" id="cards" style="display:none"></div>
            <div id="viz"></div>
        </main>
    </div>
    <script src="layout.js"></script>
    <script src="pm.js"></script>
    <script src="ui.js"></script>
    <script src="viz.js"></script>
    <script>
        const API = (location.protocol === "file:" || (["localhost", "127.0.0.1"].includes(location.hostname) && location.port !== "8000")) ? "http://localhost:8000" : location.origin;   // dev: backend on :8000; hosted: same origin as the page
        const $ = id => document.getElementById(id);
        function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
        const when = t => t ? new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "never";
        const money = (a, c) => `${Number(a).toLocaleString(undefined, { maximumFractionDigits: 2 })} ${c || ""}`.trim();

        const ICON = { in_sync: "\u2713", attention: "!", empty: "\u2026" };
        const HEAD = { in_sync: "Books and PayPal agree", attention: "Needs attention", empty: "No payments yet" };
        const EXN = { payment_failed: "Payment failed", unknown_outcome: "Outcome unknown", pending_too_long: "Pending too long", unclaimed_too_long: "Unclaimed too long", created_too_long: "Never sent", success_mismatch: "PayPal says different status", amount_mismatch: "Amount differs", unknown_payout: "Payout we have no record of", payment_returned: "Payout returned by PayPal" };
        function card(t, n, h) { const c = el("div", "card"); c.appendChild(el("div", "t", t)); c.appendChild(el("div", "n", n)); c.appendChild(el("div", "h", h)); return c; }
        const V = window.PMViz; V.css();
        const PAYCOL = { success: V.C.good, pending: V.C.amber, submitted: V.C.blue, created: "#8a8a82", unclaimed: V.C.amber, failed: V.C.bad, unknown: V.C.bad, returned: V.C.violet };
        const PAYLBL = { created: "Created", submitted: "Sent to PayPal", pending: "Pending at PayPal", unclaimed: "Unclaimed by vendor", success: "Paid and confirmed", failed: "Failed", unknown: "Outcome unknown", returned: "Returned" };
        let timer = null;
        function heroCard(d) {
            const c = V.card("vz-12", "", ""); c.style.display = "grid"; c.style.gridTemplateColumns = "minmax(150px,190px) 1fr"; c.style.gap = "16px"; c.style.alignItems = "center";
            const col = d.state === "attention" ? V.C.bad : d.state === "empty" ? "#8a8a82" : V.C.good;
            c.style.borderLeft = `5px solid ${col}`;
            c.appendChild(V.gauge(d.health, d.health >= 90 ? V.C.good : d.health >= 60 ? V.C.amber : V.C.bad, "Reconciliation health", "health"));
            const w = V.el("div"); const top = V.el("div"); top.style.cssText = "display:flex;gap:10px;align-items:center;flex-wrap:wrap";
            top.appendChild(V.el("b", "", HEAD[d.state])); top.style.fontSize = "20px";
            const live = V.el("span", "vz-live"); live.appendChild(V.el("i")); live.appendChild(document.createTextNode("Live, refreshes every 15 s")); top.appendChild(live); w.appendChild(top);
            if (d.problems.length) { const u = V.el("ul"); u.style.margin = "6px 0 0 18px"; d.problems.forEach(p => u.appendChild(V.el("li", "", p))); w.appendChild(u); }
            else w.appendChild(V.el("div", "sub", d.state === "empty" ? "Reconcile has nothing to compare yet." : "Every successful payment has a PayPal webhook and balanced ledger entries, and nothing disagrees."));
            const chk = V.el("div"); chk.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-top:10px";
            [["Ledger balanced", d.ledger_balanced], ["Every paid invoice booked", !d.problems.some(p => /no ledger/.test(p))], ["PayPal agrees", !d.problems.some(p => /disagree/.test(p))], ["Nothing stuck", d.stuck === 0], ["All exceptions resolved", d.exceptions.length === 0]].forEach(([l, ok]) => chk.appendChild(V.el("span", "chip " + (ok ? "good" : "bad"), (ok ? "\u2713 " : "! ") + l)));
            w.appendChild(chk); c.appendChild(w); return c;
        }
        function render(d) {
            const box = $("viz"); box.textContent = ""; const a = d.analytics, P = d.payments, n = k => (P[k] ? P[k].count : 0), day = a.daily;
            const g = V.el("div", "vz-grid"); g.appendChild(heroCard(d));
            g.appendChild(V.kpi("Paid and confirmed", n("success"), P.success ? money(P.success.amount) + " in total" : "no money moved yet", V.C.good, day.map(r => r.settled)));
            g.appendChild(V.kpi("In flight", n("submitted") + n("pending") + n("created"), "waiting for PayPal", V.C.blue, null));
            g.appendChild(V.kpi("Stuck or unknown", d.stuck, d.stuck ? "the recovery job retries these" : "nothing stuck", d.stuck ? V.C.bad : V.C.good, null));
            g.appendChild(V.kpi("Open exceptions", d.exceptions.reduce((x, e) => x + e.open, 0), `${a.exceptions.resolved} resolved so far`, V.C.amber, day.map(r => r.opened)));
            const L = [];
            if (a.latency.median != null) L.push({ text: `Payouts settle in ${V.dur(a.latency.median)} typically (slowest 10%: ${V.dur(a.latency.p90)}), measured from our request to PayPal's settlement.` });
            if (a.flow.payments) L.push({ text: `${a.flow.payments} settled payment(s): ${money(a.flow.received)} reached vendors; PayPal fees were ${money(a.flow.fees)} (${(100 * a.flow.fees / Math.max(1, a.flow.sent)).toFixed(2)}% of money sent).` });
            if (a.exceptions.oldest_open_seconds != null) L.push({ kind: a.exceptions.oldest_open_seconds > 86400 ? "warn" : "", text: `The oldest open exception ${a.exceptions.oldest_open_seconds < 60 ? "was opened just now" : "is " + V.dur(a.exceptions.oldest_open_seconds) + " old"}.${a.exceptions.median_fix_seconds != null ? " Problems are usually fixed in " + V.dur(a.exceptions.median_fix_seconds) + "." : ""}` });
            if (!d.problems.length && d.state !== "empty") L.push({ text: "Nothing disagrees. Every payment we sent can be traced to a PayPal confirmation and a balanced ledger entry." });
            if (L.length) g.appendChild(V.insight(L));

            const c1 = V.card("vz-7", "Payments settled per day", "Last 14 days. Hover a bar for the amount.");
            if (day.some(r => r.settled || r.failed)) { const ser = [{ key: "settled", label: "Settled", color: V.C.good2 }, { key: "failed", label: "Failed", color: V.C.bad }]; c1.appendChild(V.stacked(day, ser, { label: "Payments settled per day" })); c1.appendChild(V.legend(ser)); }
            else c1.appendChild(V.el("div", "vz-empty", "No settled payments in the last 14 days."));
            g.appendChild(c1);

            const c2 = V.card("vz-5", "Where the money went", "Sent from your account, split into what vendors got and fees");
            if (Number(a.flow.sent) > 0) c2.appendChild(V.hbars([{ label: "Sent from you", value: Number(a.flow.sent), color: V.C.blue }, { label: "Reached vendors", value: Number(a.flow.received), color: V.C.good2 }, { label: "PayPal fees", value: Number(a.flow.fees), color: V.C.amber }], v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 })));
            else c2.appendChild(V.el("div", "vz-empty", "No settled money yet."));
            g.appendChild(c2);

            const c3 = V.card("vz-7", "Problems opened vs fixed", "Is the team keeping up with exceptions?");
            if (day.some(r => r.opened || r.resolved)) { const ser = [{ key: "opened", label: "Opened", color: V.C.bad }, { key: "resolved", label: "Resolved", color: V.C.good }]; c3.appendChild(V.lines(day, ser, { label: "Exceptions opened and resolved" })); c3.appendChild(V.legend(ser)); }
            else c3.appendChild(V.el("div", "vz-empty", "No exceptions in the last 14 days. That is a good sign."));
            g.appendChild(c3);

            const c4 = V.card("vz-5", "Payments by status", "Everything that has been sent to PayPal");
            const ord = ["created", "submitted", "pending", "unclaimed", "success", "failed", "unknown", "returned"].filter(k => P[k]);
            if (ord.length) c4.appendChild(V.hbars(ord.map(k => ({ label: PAYLBL[k], value: P[k].count, color: PAYCOL[k], tip: `${PAYLBL[k]}: ${P[k].count} payment(s), ${money(P[k].amount)}` })))); else c4.appendChild(V.el("div", "vz-empty", "No payments yet."));
            g.appendChild(c4);

            const c5 = V.card("vz-6", "Open exceptions", "Things a person needs to look at");
            if (!d.exceptions.length) c5.appendChild(V.el("div", "vz-empty", "No open exceptions."));
            else c5.appendChild(V.hbars(d.exceptions.map(e => ({ label: EXN[e.type] || e.type.replace(/_/g, " "), value: e.open, color: V.C.bad, tip: `oldest ${when(e.oldest)}` }))));
            g.appendChild(c5);

            const c6 = V.card("vz-6", "Recent reconcile runs", "Each run checks PayPal against our records");
            if (!d.runs.length) c6.appendChild(V.el("div", "vz-empty", "No runs yet."));
            d.runs.forEach(x => { const row = V.el("div"); row.style.cssText = "display:grid;grid-template-columns:14px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #f1f0ea"; const dot = V.el("i"); dot.style.cssText = `width:10px;height:10px;border-radius:50%;background:${/nothing|0 /i.test(x.result) ? V.C.good2 : V.C.amber};margin-top:5px`; row.appendChild(dot); const t = V.el("div"); t.appendChild(V.el("b", "", when(x.at))); t.appendChild(V.el("div", "h", x.result)); row.appendChild(t); c6.appendChild(row); });
            g.appendChild(c6);
            box.appendChild(g);
        }
        async function load() {
            try {
                const r = await fetch(`${API}/reconcile/status`);
                if (!r.ok) { $("banner").textContent = `Could not load (error ${r.status})`; return; }
                const d = await r.json(); $("banner").textContent = "";
                $("last").textContent = d.last_run ? `Last run ${when(d.last_run.at)}: ${d.last_run.result}` : "Reconcile has not been run yet";
                render(d);
            } catch (e) { $("banner").textContent = "Cannot reach the API"; }
            clearTimeout(timer); timer = setTimeout(load, 15000);
        }
        $("run").onclick = async () => {
            $("run").disabled = true;
            try { const r = await fetch(`${API}/reconcile/run`, { method: "POST" }); const d = await r.json().catch(() => ({})); r.ok ? PM.toast("Reconcile finished", "ok") : PM.toast(typeof d.detail === "string" ? d.detail : "Could not run reconcile", "error"); }
            catch (e) { PM.toast("Cannot reach the API", "error"); }
            $("run").disabled = false; load();
        };
        load();
    </script>
</body>

</html>
