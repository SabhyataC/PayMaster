<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>PayMaster Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
    <style>
        :root {
            --bg: #f4f5f2;
            --line: #e4e2da;
            --ink: #1c1b18;
            --muted: #6b6a63;
            --brand: #0b6b4f;
            --brand-d: #08543e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .app {
            display: grid;
            grid-template-columns: 230px 1fr;
            min-height: 100vh;
        }

        .side {
            background: #10231c;
            color: #cfe3da;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            font-weight: 700;
            font-size: 19px;
            color: #fff;
            padding: 4px 10px 20px;
        }

        .brand span {
            color: #4ad4a0;
        }

        .nav a {
            display: block;
            padding: 9px 12px;
            border-radius: 8px;
            color: #cfe3da;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 3px;
        }

        .nav a:hover {
            background: #1a3a2f;
        }

        .nav a.active {
            background: var(--brand);
            color: #fff;
        }

        .nav hr {
            border: 0;
            border-top: 1px solid #1f3d32;
            margin: 10px 0;
        }

        .side .foot {
            margin-top: auto;
            padding: 12px 10px 0;
            font-size: 12px;
            border-top: 1px solid #1f3d32;
        }

        .side .foot button {
            margin-top: 8px;
            width: 100%;
            background: none;
            border: 1px solid #3a5a4d;
            color: #cfe3da;
        }

        .main {
            padding: 22px 28px;
            min-width: 0;
        }

        .top h1 {
            font-size: 22px;
            margin: 0 0 16px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .box {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .box h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
            color: var(--muted);
        }

        #cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        #attn {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        button {
            background: var(--brand);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 7px 14px;
            cursor: pointer;
            font: inherit;
            font-weight: 500;
        }

        button:hover {
            background: var(--brand-d);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        .ag-theme-quartz {
            --ag-font-size: 13px;
            --ag-header-background-color: #f1efe8;
            --ag-border-radius: 10px;
            --ag-borders: solid 1px;
            --ag-border-color: #e4e2da;
        }

        .ag-theme-quartz button {
            padding: 1px 10px;
            font-size: 12px;
            background: none;
            color: var(--brand);
            border: 1px solid var(--brand);
        }

        .ag-theme-quartz button:hover {
            background: var(--brand);
            color: #fff;
        }

        input,
        select,
        textarea {
            font: inherit;
            border: 1px solid #cfcdc4;
            border-radius: 8px;
            padding: 7px 9px;
            background: #fff;
        }

        .tbl {
            border-collapse: collapse;
            width: 100%;
        }

        .tbl th,
        .tbl td {
            border-bottom: 1px solid var(--line);
            padding: 6px 8px;
            text-align: left;
            font-size: 13px;
            vertical-align: top;
        }

        .tbl th {
            background: #f1efe8;
        }

        .panel {
            display: none;
            margin: 14px 0;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        #detail {
            display: none;
            margin: 14px 0;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        #q {
            width: 100%;
            max-width: 640px;
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="brand">Pay<span>Master</span></div>
            <nav class="nav">
                <a data-v="overview" data-t="Overview" class="active">Overview</a>
                <a data-v="invoices" data-t="Invoices">Invoices</a>
                <a data-v="review" data-t="Review queue">Review queue</a>
                <a data-v="exceptions" data-t="Exceptions">Exceptions</a>
                <a data-v="payments" data-t="Payments and ledger">Payments &amp; ledger</a>
                <a data-v="assistant" data-t="Ask and Advise">Ask &amp; Advise</a>
                <hr>
                <a href="vendors.html">Vendors &amp; POs</a>
                <a href="team.html" class="admin-only">Team &amp; settings</a>
                <a href="account.html">My account</a>
            </nav>
            <div class="foot">
                <div id="who"></div>
                <button id="logout">Log out</button>
            </div>
        </aside>

        <main class="main">
            <div class="top">
                <h1 id="ptitle">Overview</h1>
            </div>

            <section class="view active" id="v-overview">
                <div id="cards"></div>
                <div id="attn"></div>
            </section>

            <section class="view" id="v-invoices">
                <div class="box">
                    <div class="toolbar rev-only">
                        <input type="file" id="ufile" accept=".pdf,.png,.jpg,.jpeg,.txt,.eml">
                        <button id="upbtn">Upload invoice</button> <span id="umsg"></span>
                    </div>
                    <div class="toolbar"><button id="loadi">Refresh</button> <span id="imsg"></span></div>
                    <div id="igrid" class="ag-theme-quartz" style="height:60vh"></div>
                </div>
            </section>

            <section class="view" id="v-review">
                <div class="box">
                    <div class="toolbar"><button id="loadq">Refresh</button> <span id="qmsg"></span></div>
                    <div id="qgrid" class="ag-theme-quartz" style="height:40vh"></div>
                </div>
                <div id="detail"></div>
            </section>

            <section class="view" id="v-exceptions">
                <div class="box">
                    <div class="toolbar">
                        <select id="status">
                            <option>open</option>
                            <option>resolved</option>
                        </select>
                        <button id="load">Refresh</button> <span id="msg"></span>
                    </div>
                    <div id="grid" class="ag-theme-quartz" style="height:45vh"></div>
                </div>
                <div id="xdetail" class="panel"></div>
            </section>

            <section class="view" id="v-payments">
                <div class="box">
                    <div class="toolbar"><button id="loadp">Refresh</button> <span id="pmsg"></span></div>
                    <div id="pgrid" class="ag-theme-quartz" style="height:40vh"></div>
                </div>
                <div id="pdetail" class="panel"></div>
            </section>

            <section class="view" id="v-assistant">
                <div class="box">
                    <h3>Ask PayMaster</h3>
                    <div class="toolbar">
                        <input id="q" placeholder="e.g. Why was INV-6001 held?" maxlength="1000">
                        <button id="ask">Ask</button> <span id="qa_msg"></span>
                    </div>
                    <div id="answer" class="panel"></div>
                </div>
                <div class="box">
                    <h3>Advise</h3>
                    <div class="toolbar"><button id="loada">Load advice</button> <span id="amsg"></span></div>
                    <div id="advice" class="panel"></div>
                </div>
            </section>

            <div id="audit" class="panel"></div>
        </main>
    </div>

    <script src="pm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
    <script>
        const API = "http://localhost:8000";
        const pmUser = JSON.parse(localStorage.getItem("pm_user") || "null");
        if (!pmUser) location.replace("login.html");
        else if (pmUser && !pmUser.company_id) location.replace("company.html");
        document.getElementById("who").textContent = pmUser ? `${pmUser.full_name} · ${pmUser.company_name || ""}` : "";
        document.getElementById("logout").onclick = () => PM.logout();
        const $ = (id) => document.getElementById(id);

        function actionsCell(p) {
            const box = document.createElement("span");
            const mk = (label, fn) => {
                const b = document.createElement("button");
                b.textContent = label;
                b.style.marginRight = "6px";
                b.addEventListener("click", (ev) => { ev.stopPropagation(); fn(); });
                box.appendChild(b);
            };
            if (PM.canAct()) mk("Explain", () => act(p.data.id, "explain"));
            if (PM.canAct() && p.data.status === "open") {
                mk("Resolve", () => {
                    const note = prompt("Note (what did you check in PayPal?):");
                    if (!note) return;
                    act(p.data.id, "resolve", { note: note });
                });
            }
            return box;
        }

        async function act(id, what, body) {
            $("msg").textContent = what + "...";
            try {
                const r = await fetch(`${API}/exceptions/${id}/${what}`, {
                    method: "POST",
                    headers: hdr(),
                    body: JSON.stringify(body || {}),
                });
                if (!r.ok) {
                    const e = await r.json().catch(() => ({}));
                    $("msg").textContent = `Error ${r.status}: ${e.detail || ""}`;
                    return;
                }
            } catch (e) {
                $("msg").textContent = "Cannot reach the API";
                return;
            }
            await loadExceptions();
            if (openExc === id) showException(id);
        }

        const gridApi = agGrid.createGrid($("grid"), {
            columnDefs: [
                { field: "id", width: 80 },
                { field: "type", width: 180 },
                { field: "status", width: 110, cellRenderer: badge },
                { field: "created_at", width: 200 },
                { headerName: "Detail", valueGetter: (p) => JSON.stringify(p.data.detail), flex: 1 },
                { headerName: "AI explanation", valueGetter: (p) => p.data.explanation ? p.data.explanation.explanation : "", flex: 2 },
                { headerName: "Actions", width: 190, sortable: false, filter: false, cellRenderer: actionsCell },
            ],
            defaultColDef: { sortable: true, filter: true, resizable: true },
            rowData: [],
            onRowClicked: (e) => showException(e.data.id),
        });

        async function loadExceptions() {
            $("msg").textContent = "Loading...";
            try {
                const r = await fetch(`${API}/exceptions?status=${$("status").value}`, {
                    headers: hdr(),
                });
                if (!r.ok) { $("msg").textContent = `Error ${r.status}`; return; }
                const data = await r.json();
                gridApi.setGridOption("rowData", data.items);
                $("msg").textContent = `${data.items.length} rows`;
            } catch (e) {
                $("msg").textContent = "Cannot reach the API (is uvicorn running?)";
            }
        }
        $("load").addEventListener("click", loadExceptions);

        const hdr = () => ({ "Content-Type": "application/json" });
        const errText = (e) => (e.detail && typeof e.detail === "object") ? e.detail.message : (e.detail || "");


        function esc(s) {
            return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        }
        function list(items, empty) {
            return items.length ? "<ul>" + items.map((x) => `<li>${esc(x)}</li>`).join("") + "</ul>" : `<p><i>${empty}</i></p>`;
        }

        function plainError(e) {
            const d = e && e.detail;
            const code = d && d.code;
            const MAP = {
                note_too_short: "Your note is too short. Write at least 10 characters explaining why.",
                not_allowed: "A person cannot do that to this invoice in its current status. Reload and check its status.",
                confirmation_required: "This invoice changed its bank details. Confirm with the vendor first, then tick the box.",
                hard_reject: "Cannot approve: " + ((d && d.message) || "a hard check says this must not be paid."),
                not_found: "That invoice no longer exists. Reload the page.",
            };
            if (code && MAP[code]) return MAP[code];
            if (d && d.message) return d.message;
            return typeof d === "string" ? d : "Something went wrong. Reload and try again.";
        }

        async function showCase(id) {
            const box = $("detail");
            box.style.display = "block";
            box.textContent = "Loading...";
            try {
                const r = await fetch(`${API}/review/${id}`, { headers: hdr() });
                const c = await r.json();
                if (!r.ok) { box.textContent = `Error ${r.status}: ${errText(c)}`; return; }
                const inv = c.invoice;
                const v = c.verify || {};
                const signals = (c.fraud_rows || []).filter((f) => !f.reason.startsWith("Fraud risk")).map((f) => `${f.decision}: ${f.reason}`);
                const prec = (c.precedents || []).map((p) =>
                    `${p.invoice_number}: AI said ${p.ai_decision}, ${p.reviewer} said ${p.human_decision}, outcome ${p.outcome}`);
                const hist = (c.history || []).map((h) => `${h.stage}: ${h.decision} by ${h.actor || "system"}: ${h.reason}`);
                const pol = c.policy || {};
                box.innerHTML = `
                    <h3>${esc(inv.invoice_number)} (${esc(inv.vendor)}): ${esc(inv.amount)} ${esc(inv.currency)}</h3>
                    <p>Status <b>${esc(inv.status)}</b>. Pays to ${esc(inv.destination_email || "the vendor's email on file")}. Has PO: ${inv.has_po ? "yes" : "no"}.</p>
                    <h4>AI verdict: ${esc(v.decision || "none yet")} (confidence ${esc(v.confidence ?? "n/a")})</h4>
                    ${list(v.reasons || [], "No reasons recorded.")}
                    <h4>Evidence</h4>${list((v.evidence || []).map((e) => typeof e === "string" ? e : `${e.passed ? "✔ PASSED" : "✘ FAILED"}  ${e.check}: ${e.detail}`), "No evidence recorded.")}
                    <h4>Fraud signals</h4>${list(signals, "No fraud signals fired.")}
                    <h4>Would policy allow paying it right now? ${esc(pol.outcome || "")}</h4>${list(pol.reasons || [], "No policy reasons.")}
                    <h4>Past similar cases (same vendor, same signals)</h4>${list(prec, "No past cases.")}
                    <h4>What has happened so far</h4>${list(hist, "No review or payment steps yet.")}`;
                const allowed = c.allowed_actions || [];
                if (PM.canAct() && (allowed.includes("approve") || allowed.includes("reject"))) {
                    const f = document.createElement("div");
                    f.style.cssText = "margin-top:14px;padding:10px;background:#f6f6f6;border-radius:6px";
                    f.innerHTML = `
                        <h4>Your decision</h4>
                        <div style="margin:6px 0"><textarea id="d_note" rows="2" cols="60" placeholder="Why? (at least 10 characters)"></textarea></div>
                        <label><input type="checkbox" id="d_confirmed"> I confirmed the bank details with the vendor (needed when the bank details changed)</label>
                        <div style="margin-top:8px">
                            ${PM.canAct() && allowed.includes("approve") ? '<button id="d_approve">Approve</button> ' : ""}
                            ${PM.canAct() && allowed.includes("reject") ? '<button id="d_reject">Reject</button>' : ""}
                            <span id="d_msg" style="margin-left:10px"></span>
                        </div>`;
                    box.appendChild(f);
                    const send = async (decision) => {
                        const r2 = await fetch(`${API}/review/${id}/decision`, {
                            method: "POST", headers: hdr(),
                            body: JSON.stringify({
                                decision,
                                note: $("d_note").value.trim(),
                                confirmed_with_vendor: $("d_confirmed").checked,
                            }),
                        });
                        const e2 = await r2.json().catch(() => ({}));
                        if (!r2.ok) { $("d_msg").textContent = plainError(e2); $("d_msg").style.color = "#c62828"; return; }
                        await loadQueue();
                        await showCase(id);
                    };
                    if ($("d_approve")) $("d_approve").addEventListener("click", () => send("approve"));
                    if ($("d_reject")) $("d_reject").addEventListener("click", () => send("reject"));
                }
            } catch (e) { box.textContent = "Cannot reach the API"; }
        }

        const qApi = agGrid.createGrid($("qgrid"), {
            columnDefs: [
                { field: "invoice_number", width: 140 },
                { field: "vendor", width: 160 },
                { field: "amount", width: 100 },
                { field: "currency", width: 90 },
                { field: "status", width: 120, cellRenderer: badge },
                { field: "stage", width: 120 },
                { headerName: "Why", valueGetter: (p) => (p.data.reasons || []).join(", "), flex: 1 },
                { headerName: "Actions", width: 270, sortable: false, filter: false, cellRenderer: queueActions },
            ],
            defaultColDef: { sortable: true, filter: true, resizable: true },
            rowData: [],
            onRowClicked: (e) => showCase(e.data.invoice_id),
        });

        async function loadQueue() {
            $("qmsg").textContent = "Loading...";
            try {
                const r = await fetch(`${API}/review/queue`, { headers: hdr() });
                if (!r.ok) { $("qmsg").textContent = `Error ${r.status}`; return; }
                const data = await r.json();
                qApi.setGridOption("rowData", data.items);
                $("qmsg").textContent = `${data.items.length} rows`;
                await loadInvoices();
            } catch (e) { $("qmsg").textContent = "Cannot reach the API"; }
        }
        $("loadq").addEventListener("click", loadQueue);

        function queueActions(p) {
            const box = document.createElement("span");
            const mk = (label, fn) => {
                const b = document.createElement("button");
                b.textContent = label; b.style.marginRight = "6px";
                b.addEventListener("click", fn); box.appendChild(b);
            };
            const id = p.data.invoice_id;
            mk("Audit", (ev) => { ev.stopPropagation(); showAudit(id); });
            if (PM.canAct() && p.data.status === "held") {
                mk("Approve", () => decide(id, "approve"));
                mk("Reject", () => decide(id, "reject"));
            } else {
                mk("Pay", () => payInvoice(id, p.data));
            }
            return box;
        }

        async function decide(id, decision, confirmedWithVendor) {
            const note = prompt("Why? (at least 10 characters)");
            if (!note) return;
            await sendDecision(id, decision, note, false);
        }

        async function sendDecision(id, decision, note, confirmed) {
            const r = await fetch(`${API}/review/${id}/decision`, {
                method: "POST", headers: hdr(),
                body: JSON.stringify({ decision, note, confirmed_with_vendor: confirmed }),
            });
            if (r.ok) { $("qmsg").textContent = `${decision} done`; return loadQueue(); }
            const e = await r.json().catch(() => ({}));
            if (e.detail && e.detail.code === "confirmation_required" && !confirmed) {
                if (confirm(e.detail.message + "\n\nHave you confirmed with the vendor?")) {
                    return sendDecision(id, decision, note, true);
                }
            }
            $("qmsg").textContent = `Error ${r.status}: ${errText(e)}`;
        }

        function payMessage(d) {
            switch (d.status) {
                case "submitted": return "Sent to PayPal. It becomes 'paid' when PayPal confirms (a few minutes).";
                case "already_exists": return `Not sent again: this invoice already has a payment (${d.payment_status}). Nothing was paid twice.`;
                case "held": return `Not sent: needs a person's release (${(d.reasons || []).join(", ")}).`;
                case "blocked": return `Blocked, not sent: ${(d.reasons || []).join(", ")}.`;
                case "not_approved": return `Not sent: the invoice is '${d.invoice_status}', not approved.`;
                case "unknown": return "PayPal did not answer clearly. Outcome unknown. Do NOT click Pay again; run reconcile.";
                case "failed": return "PayPal refused the payment.";
                default: return `Result: ${d.status}`;
            }
        }

        async function payInvoice(id, row) {
            if (!confirm(`Pay ${row.amount} ${row.currency} to ${row.vendor}?`)) return;
            const r = await fetch(`${API}/review/${id}/pay`, {
                method: "POST", headers: hdr(),
            });
            const e = await r.json().catch(() => ({}));
            const m = r.ok ? payMessage(e) : `Error ${r.status}: ${errText(e)}`;
            if (r.ok) await loadQueue();
            $("qmsg").textContent = m;
            $("imsg").textContent = m;
        }

        const BADGE = {
            approved: "#2e7d32", held: "#ed6c02", rejected: "#c62828", paid: "#1565c0", needs_review: "#6a1b9a",
            success: "#2e7d32", submitted: "#ed6c02", pending: "#ed6c02", unclaimed: "#c62828", failed: "#c62828", unknown: "#c62828",
            open: "#ed6c02", resolved: "#2e7d32", returned: "#6a1b9a"
        };
        function badge(p) {
            const c = BADGE[p.value] || "#777777";
            const s = document.createElement("span");
            s.textContent = p.value || "";
            s.style.cssText = `background:${c}1a;color:${c};padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600`;
            return s;
        }
        function invoiceActions(p) {
            const box = document.createElement("span");
            const au = document.createElement("button");
            au.textContent = "Audit"; au.style.marginRight = "6px";
            au.addEventListener("click", () => showAudit(p.data.id));
            box.appendChild(au);
            if (PM.canAct() && p.data.status === "approved") {
                const b = document.createElement("button");
                b.textContent = "Pay";
                b.addEventListener("click", async () => {
                    await payInvoice(p.data.id, p.data);
                    loadInvoices();
                });
                box.appendChild(b);
            }
            return box;
        }

        const iApi = agGrid.createGrid($("igrid"), {
            columnDefs: [
                { field: "invoice_number", headerName: "Number", width: 140 },
                { field: "vendor", width: 180 },
                { field: "amount", width: 110 },
                { field: "currency", width: 100 },
                { field: "status", width: 130, cellRenderer: badge },
                { field: "fraud_risk", headerName: "Fraud risk", width: 120 },
                { field: "received_at", headerName: "Received", flex: 1 },
                { headerName: "Actions", width: 190, sortable: false, filter: false, cellRenderer: invoiceActions },
            ],
            defaultColDef: { sortable: true, filter: true, resizable: true },
            rowData: [],
        });

        async function loadAttention() {
            const box = $("attn");
            try {
                const r = await fetch(`${API}/attention`);
                if (!r.ok) { box.textContent = ""; return; }
                const d = await r.json();
                const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
                const sec = (title, rows, fmt) => rows.length
                    ? `<div style="margin:6px 0"><b>${title} (${rows.length})</b><ul style="margin:4px 0 0 18px;padding:0">${rows.map(x => `<li>${fmt(x)} <span style="color:#6b6a63">· ${x.days}d</span></li>`).join("")}</ul></div>` : "";
                const html =
                    sec("Waiting for a delivery to be recorded", d.waiting_delivery, x => `${e(x.invoice)} (${e(x.vendor)}) ${x.amount} ${e(x.currency)}, ${e(x.po)} delivered ${x.delivered}`) +
                    sec("Documents waiting for a vendor or PO", d.needs_fix, x => `${e(x.file)}: ${e(x.reason)}`) +
                    sec("Approved, ready for a person to pay", d.ready_to_pay, x => `${e(x.invoice)} (${e(x.vendor)}) ${x.amount} ${e(x.currency)}`) +
                    sec("Delivered, no invoice yet", d.delivered_no_invoice, x => `${e(x.po)} (${e(x.vendor)}) ${x.amount} ${e(x.currency)}`);
                box.innerHTML = `<b style="color:${d.total ? "#b4531a" : "#0b6b4f"}">Needs attention: ${d.total}</b>` + (html || `<div style="color:#6b6a63">Nothing is waiting.</div>`);
            } catch (err) { box.textContent = ""; }
        }

        async function loadInvoices() {
            loadAttention();
            $("imsg").textContent = "Loading...";
            try {
                const r = await fetch(`${API}/invoices`, { headers: hdr() });
                if (!r.ok) { $("imsg").textContent = `Error ${r.status}`; return; }
                const data = await r.json();
                iApi.setGridOption("rowData", data.items);
                $("imsg").textContent = data.items.length ? `${data.items.length} invoices` : "No invoices yet.";
                loadSummary();
            } catch (e) {
                $("imsg").textContent = "Cannot reach the API (is uvicorn running?)";
            }
        }

        $("loadi").addEventListener("click", loadInvoices);

        $("upbtn").addEventListener("click", async () => {
            const f = $("ufile").files[0];
            if (!f) { $("umsg").textContent = "Choose a file first"; return; }
            const fd = new FormData();
            fd.append("file", f);
            $("upbtn").disabled = true;
            $("umsg").textContent = "Reading and checking the invoice (10-30 seconds)...";
            try {
                const r = await fetch(`${API}/invoices/upload`, {
                    method: "POST",
                    body: fd,
                });
                const d = await r.json().catch(() => ({}));
                if (r.status === 401) { localStorage.removeItem("pm_jwt"); location.replace("login.html"); return; }
                if (!r.ok) { $("umsg").textContent = typeof d.detail === "string" ? d.detail : "Upload failed"; return; }
                if (d.intake === "accepted") {
                    $("umsg").textContent = `Invoice ${d.invoice_status}: ${d.verdict}` + (d.verdict_reasons.length ? " (" + d.verdict_reasons.join(", ") + ")" : "")
                        + (d.payment ? ` | payment: ${d.payment}` + (d.payment_reasons && d.payment_reasons.length ? " (" + d.payment_reasons.join(", ") + ")" : "") : "");
                    loadInvoices();
                } else {
                    $("umsg").textContent = d.intake === "failed"
                        ? "The AI service is busy right now. Please upload again in a minute."
                        : `Needs a person to look: ${d.reason || d.intake}`;
                }
                $("ufile").value = "";
            } catch (e) {
                $("umsg").textContent = "Cannot reach the API (is uvicorn running?)";
            } finally {
                $("upbtn").disabled = false;
            }
        });

        // ---- Summary cards ----
        function card(title, body, warn) {
            return `<div style="background:#fff;border:1px solid #e4e2da;border-left:4px solid ${warn ? "#ed6c02" : "#0b6b4f"};border-radius:12px;padding:14px 16px">
        <div style="font-size:11px;color:#6b6a63;text-transform:uppercase;letter-spacing:.05em">${esc(title)}</div>
        <div style="font-size:26px;font-weight:700;margin-top:4px">${body}</div></div>`;
        }
        function renderCards(s) {
            const byStatus = Object.entries(s.invoices_by_status).map(([k, n]) => `${esc(k)} ${n}`).join(", ") || "none yet";
            const paid = Object.entries(s.paid_total)
                .map(([c, t]) => `${Number(t).toLocaleString(undefined, { minimumFractionDigits: 2 })} ${esc(c)}`).join("<br>") || "0";
            return card("Invoices", `${s.invoices_total}<div style="font-size:12px;font-weight:400">${byStatus}</div>`)
                + card("Held for a person", s.held_count, s.held_count > 0)
                + card("Paid total", paid)
                + card("Open exceptions", s.open_exceptions, s.open_exceptions > 0)
                + card("Documents to fix", s.needs_review_documents, s.needs_review_documents > 0);
        }
        async function loadSummary() {
            try {
                const r = await fetch(`${API}/summary`, { headers: hdr() });
                if (!r.ok) { $("cards").innerHTML = `<i>Summary unavailable (error ${r.status})</i>`; return; }
                $("cards").innerHTML = renderCards(await r.json());
            } catch (e) { $("cards").innerHTML = "<i>Summary unavailable: cannot reach the API</i>"; }
        }

        // ---- Audit timeline: why was this held or paid ----
        function renderAudit(a) {
            const rows = a.events.map((e) => `<tr><td>${esc(e.at.slice(0, 19).replace("T", " "))}</td><td>${esc(e.stage)}</td>
        <td>${esc(e.decision)}</td><td>${esc(e.actor)}</td><td>${esc(e.reason)}</td></tr>`).join("");
            return `<h3>Audit timeline: ${esc(a.invoice_number)} (${esc(a.vendor)}), now <b>${esc(a.status)}</b></h3>`
                + (rows ? `<table class="tbl"><thead><tr><th>Time (UTC)</th><th>Stage</th><th>Decision</th><th>By</th><th>Reason</th></tr></thead><tbody>${rows}</tbody></table>`
                    : "<p><i>No audit events yet for this invoice.</i></p>");
        }
        async function showAudit(ref) {
            const box = $("audit");
            box.style.display = "block";
            box.textContent = "Loading audit timeline...";
            try {
                const r = await fetch(`${API}/audit/${encodeURIComponent(ref)}`, { headers: hdr() });
                const a = await r.json().catch(() => ({}));
                if (!r.ok) { box.textContent = `Error ${r.status}: ${errText(a)}`; return; }
                box.innerHTML = renderAudit(a);
                box.scrollIntoView({ behavior: "smooth" });
            } catch (e) { box.textContent = "Cannot reach the API (is uvicorn running?)"; }
        }

        // ---- Payments and ledger ----
        const money = (v, c) => v == null ? "-" : `${Number(v).toFixed(2)} ${esc(c || "")}`;
        function renderPayment(d) {
            const p = d.payment, s = d.settlement;
            const settle = s
                ? `<p>Settlement: we sent ${money(s.amount_sent, s.currency_sent)}, the vendor received ${money(s.amount_received, s.currency_received)},
           PayPal fee ${money(s.fee_amount, s.fee_currency)}, FX rate ${s.fx_rate == null ? "none (same currency)" : esc(s.fx_rate)}.</p>`
                : "<p><i>Not settled yet: PayPal has not confirmed this payment as successful, so there is no settlement or ledger yet.</i></p>";
            const rows = d.ledger.map((e) => `<tr><td>${esc(e.entry_type)}</td><td>${esc(e.account)}</td><td>${esc(e.direction)}</td>
        <td>${money(e.amount, e.currency)}</td><td>${esc(e.description)}</td></tr>`).join("");
            const sums = Object.entries(d.balance).map(([c, b]) =>
                `${b.debit.toFixed(2)} ${esc(c)} debit vs ${b.credit.toFixed(2)} ${esc(c)} credit`).join("; ");
            const check = d.balanced === null ? ""
                : d.balanced ? `<p style="color:#2e7d32"><b>Balanced:</b> ${sums}</p>`
                    : `<p style="color:#c62828"><b>NOT balanced:</b> ${sums}. Investigate before trusting these books.</p>`;
            return `<h3>Payment for ${esc(p.invoice_number)} (${esc(p.vendor)}): ${money(p.amount, p.currency)}, <b>${esc(p.status)}</b></h3>
        <p>Sent to ${esc(p.destination_email)}. PayPal batch ${esc(p.paypal_batch_id || "not assigned yet")}. <button id="p_audit">Show audit timeline</button></p>
        ${settle}
        ${rows ? `<table class="tbl"><thead><tr><th>Entry</th><th>Account</th><th>Direction</th><th>Amount</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
        ${check}`;
        }
        async function showPayment(id) {
            const box = $("pdetail");
            box.style.display = "block";
            box.textContent = "Loading payment...";
            try {
                const r = await fetch(`${API}/payments/${encodeURIComponent(id)}`, { headers: hdr() });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { box.textContent = `Error ${r.status}: ${errText(d)}`; return; }
                box.innerHTML = renderPayment(d);
                $("p_audit").addEventListener("click", () => showAudit(d.payment.invoice_id));
            } catch (e) { box.textContent = "Cannot reach the API (is uvicorn running?)"; }
        }

        const pApi = agGrid.createGrid($("pgrid"), {
            columnDefs: [
                { field: "invoice_number", headerName: "Invoice", width: 130 },
                { field: "amount", width: 110 },
                { field: "currency", width: 100 },
                { field: "status", width: 130, cellRenderer: badge },
                { field: "paypal_batch_id", headerName: "PayPal batch", width: 170 },
                { field: "created_at", headerName: "Created", flex: 1 },
            ],
            defaultColDef: { sortable: true, filter: true, resizable: true },
            rowData: [],
            onRowClicked: (e) => showPayment(e.data.id),
        });
        async function loadPayments() {
            $("pmsg").textContent = "Loading...";
            try {
                const r = await fetch(`${API}/payments`, { headers: hdr() });
                if (!r.ok) { $("pmsg").textContent = `Error ${r.status}`; return; }
                const data = await r.json();
                pApi.setGridOption("rowData", data.items);
                $("pmsg").textContent = data.items.length ? `${data.items.length} payments. Click one for its settlement and ledger.` : "No payments yet.";
            } catch (e) { $("pmsg").textContent = "Cannot reach the API (is uvicorn running?)"; }
        }
        $("loadp").addEventListener("click", loadPayments);
        // ---- Exception detail: explanation, suggested action, resolve form ----
        let openExc = null;
        const ACTION_TEXT = {
            wait: "Wait. PayPal has not finished yet; check again later.",
            recheck_with_paypal: "Re-check this payout in the PayPal dashboard.",
            contact_vendor: "Contact the vendor to confirm their PayPal email.",
            cancel_unclaimed: "A person may cancel the unclaimed payout in PayPal.",
            escalate: "Escalate to a person. Do not resolve this without checking PayPal.",
        };
        function renderException(x) {
            const ex = x.explanation;
            const ai = ex
                ? `<p><b>What happened:</b> ${esc(ex.explanation)}</p>
           <p><b>Suggested action:</b> ${esc(ACTION_TEXT[ex.suggested_action] || ex.suggested_action)}</p>
           <p><b>Next step for a person:</b> ${esc(ex.next_step)}</p>
           <p style="font-size:12px;color:#666">Written by ${ex.source === "template" ? "a fixed template (AI was not used)" : "AI"}. It only suggests; it never pays or cancels anything.</p>`
                : `<p><i>No explanation yet. Click "Explain".</i></p>`;
            const facts = Object.entries(x.detail || {}).map(([k, v]) =>
                `<tr><td>${esc(k)}</td><td>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("");
            const resolve = x.status === "open" && PM.canAct()
                ? `<h4>Resolve</h4>
           <p>Only after you have checked the payout in PayPal.<br>
           <textarea id="x_note" rows="2" cols="60" placeholder="What did you check in PayPal? (at least 10 characters)"></textarea><br>
           <button id="x_resolve">Resolve exception</button> <span id="x_msg"></span></p>`
                : x.status === "open" ? "" : `<p><b>Resolved</b> by ${esc(x.resolved_by)} at ${esc(String(x.resolved_at).slice(0, 19).replace("T", " "))}: ${esc(x.note)}</p>`;
            return `<h3>Exception #${esc(x.id)}: ${esc(x.type)} (<b>${esc(x.status)}</b>)</h3>
        <p>${PM.canAct() ? '<button id="x_explain">Explain</button>' : ""}
        ${x.payment_id ? '<button id="x_audit">Show invoice audit timeline</button>' : "<i>No payment attached: PayPal shows a payout we have no record of.</i>"}</p>
        ${ai}
        ${facts ? `<table class="tbl"><thead><tr><th>Fact</th><th>Value</th></tr></thead><tbody>${facts}</tbody></table>` : ""}
        ${resolve}`;
        }
        async function showException(id) {
            openExc = id;
            const box = $("xdetail");
            box.style.display = "block";
            box.textContent = "Loading exception...";
            try {
                const r = await fetch(`${API}/exceptions/${id}`, { headers: hdr() });
                const x = await r.json().catch(() => ({}));
                if (!r.ok) { box.textContent = `Error ${r.status}: ${errText(x)}`; return; }
                box.innerHTML = renderException(x);
                if ($("x_explain")) $("x_explain").addEventListener("click", () => act(id, "explain"));
                if ($("x_audit")) $("x_audit").addEventListener("click", () => auditForPayment(x.payment_id));
                if ($("x_resolve")) $("x_resolve").addEventListener("click", () => submitResolve(id));
            } catch (e) { box.textContent = "Cannot reach the API (is uvicorn running?)"; }
        }
        async function submitResolve(id) {
            const note = $("x_note").value.trim();
            if (note.length < 10) { $("x_msg").textContent = "Write at least 10 characters about what you checked in PayPal."; return; }
            $("x_msg").textContent = "Saving...";
            try {
                const r = await fetch(`${API}/exceptions/${id}/resolve`, {
                    method: "POST", headers: hdr(), body: JSON.stringify({ note }),
                });
                if (!r.ok) { const e = await r.json().catch(() => ({})); $("x_msg").textContent = `Error ${r.status}: ${errText(e)}`; return; }
                await loadExceptions();
                showException(id);
            } catch (e) { $("x_msg").textContent = "Cannot reach the API (is uvicorn running?)"; }
        }
        async function auditForPayment(paymentId) {
            try {
                const r = await fetch(`${API}/payments/${encodeURIComponent(paymentId)}`, { headers: hdr() });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { $("msg").textContent = `Error ${r.status}: ${errText(d)}`; return; }
                showAudit(d.payment.invoice_id);
            } catch (e) { $("msg").textContent = "Cannot reach the API (is uvicorn running?)"; }
        }


        async function askChat() {
            const q = $("q").value.trim();
            if (!q) return;
            $("qa_msg").textContent = "Thinking...";
            $("answer").innerHTML = ""; $("answer").style.display = "none";
            try {
                const r = await fetch(`${API}/chat`, { method: "POST", headers: hdr(), body: JSON.stringify({ question: q }) });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { $("qa_msg").textContent = `Error ${r.status}: ${errText(d)}`; return; }
                $("qa_msg").textContent = d.fallback ? "AI unavailable" : "";
                $("answer").innerHTML = `<p style="white-space:pre-wrap">${esc(d.answer)}</p>` +
                    (d.sources.length ? `<p><small>Sources: ${d.sources.map(esc).join(", ")}</small></p>` : "");
                $("answer").style.display = "block";
            } catch (e) { $("qa_msg").textContent = "Cannot reach the API (is uvicorn running?)"; }
        }
        $("ask").addEventListener("click", askChat);
        $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") askChat(); });


        async function loadAdvice() {
            $("amsg").textContent = "Loading...";
            try {
                const r = await fetch(`${API}/advise`, { headers: hdr() });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { $("amsg").textContent = `Error ${r.status}: ${errText(d)}`; return; }
                $("amsg").textContent = "";
                $("advice").innerHTML = d.tips.length ? d.tips.map((t) =>
                    `<p><b>[${esc(t.priority)}]</b> ${esc(t.text)}<br><small>Evidence: ${t.evidence.map(esc).join(", ")}</small></p>`
                ).join("") : "<p><i>No tips: nothing in the data needs attention.</i></p>";
                $("advice").style.display = "block";
            } catch (e) { $("amsg").textContent = "Cannot reach the API (is uvicorn running?)"; }
        }
        $("loada").addEventListener("click", loadAdvice);

        loadQueue();       // also loads invoices, summary cards and "needs attention"
        loadExceptions();
        loadPayments();
    </script>
    <script>
        function showView(v) {
            const a = document.querySelector(`.nav a[data-v="${v}"]`) || document.querySelector('.nav a[data-v="overview"]');
            document.querySelectorAll(".nav a").forEach(x => x.classList.toggle("active", x === a));
            document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "v-" + a.dataset.v));
            document.getElementById("ptitle").textContent = a.dataset.t;
        }
        document.querySelectorAll(".nav a[data-v]").forEach(a => a.addEventListener("click", () => {
            history.replaceState(null, "", "#" + a.dataset.v);
            showView(a.dataset.v);
        }));
        showView(location.hash.slice(1));
    </script>
</body>

</html>
