<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayMaster: PayPal account</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f6f2;
            color: #1c1b18;
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e4e2da;
            border-radius: 12px;
            padding: 24px;
            margin: 16px
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 4px
        }

        .sub {
            color: #6b6a63;
            margin: 0 0 16px;
            font-size: .9rem
        }

        label {
            display: block;
            font-size: .85rem;
            margin: 12px 0 4px
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid #cfcdc4;
            border-radius: 8px;
            font: inherit;
            background: #f1f0ea;
            color: #1c1b18
        }

        .note {
            background: #e3f3ec;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 14px;
            font-size: .85rem
        }

        button.main {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: #0b6b4f;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        .err {
            color: #b4531a;
            font-size: .9rem;
            margin-top: 12px;
            min-height: 1.2em
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Payment account</h1>
        <p class="sub">The PayPal account PayMaster pays from</p>

        <label for="email">PayPal account email</label>
        <input id="email" readonly value="Loading...">

        <div class="note">
            This is the PayPal account all vendor payments are sent from. It is set up by PayMaster
            and cannot be changed here. (Sandbox mode: no real money moves.)
        </div>

        <div class="err" id="err"></div>
        <button class="main" id="go">Continue</button>
    </div>

    <script>
        const API = "http://localhost:8000";   // same value as in index.html
        const $ = id => document.getElementById(id);
        const jwt = localStorage.getItem("pm_jwt");
        if (!jwt) location.replace("login.html");

        $("go").onclick = () => location.replace("index.html");

        (async () => {
            try {
                const r = await fetch(`${API}/auth/paypal-account`, {
                    headers: { "Authorization": "Bearer " + jwt },
                });
                if (r.status === 401) {
                    localStorage.removeItem("pm_jwt");
                    localStorage.removeItem("pm_user");
                    return location.replace("login.html");
                }
                const data = await r.json();
                $("email").value = data.email || "Not configured";
                if (!data.email) $("err").textContent = "PAYPAL_ACCOUNT_EMAIL is missing in the server .env";
            } catch (e) {
                $("email").value = "";
                $("err").textContent = "Cannot reach the server. Is the API running?";
            }
        })();
    </script>
</body>

</html>
